summary: 'A deliberately flat model. There are 21 component schemas and essentially ONE domain concept
  repeated per modality: a Job. Jobs do not reference each other, there is no customer/project/workspace
  entity, and there are no foreign keys between resources -- media flows between operations as URL STRINGS,
  not as typed references. That is the defining shape of this API and it is why there is no ERD worth
  drawing beyond the job families.'
entity_count: 21
entities:
