gaps:
- No customer, account, project, workspace or team entity is exposed. The account is implicit in the API
  key.
- No job LIST or history resource over REST -- a caller that loses a job id cannot recover it. Only the
  MCP get_generation_history tool can.
- Three job families (UpscaleJob, LipSyncJob, MotionJob) type `status` as a plain string instead of reusing
  the JobStatus enum, so a generic client cannot validate their states against the documented lifecycle.
- Media crosses operation boundaries as URLs with no provenance field, so lineage (which upload, which
  job, which post) is not recoverable from the API.
