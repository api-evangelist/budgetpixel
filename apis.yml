name: BudgetPixel
aid: budgetpixel
description: 'BudgetPixel is an AI creative platform offering credit-based access to 70+ generative media models for image,
  video, music and sound-effect generation, plus upscaling, lip sync, motion control, format conversion and content moderation.
  Alongside a free design-studio canvas, LoRA training and a public community feed, it ships a unified developer surface:
  a 74-operation OpenAPI 3.1 REST API at api.budgetpixel.com/v1 (private beta, bearer bpx_live_* keys, Premium/Pro/Ultra plans)
  with an asynchronous create-then-poll job model and a POST /v1/cost endpoint that quotes the exact credit charge before
  you commit; a first-party remote MCP server at mcp.budgetpixel.com/mcp exposing 12 tools over streamable HTTP with OAuth
  2.1 + PKCE and Google SSO; an A2A agent card and a published Agent Skill; and llms.txt indexes. One credit balance, one
  set of conventions, and identical published prices across every surface.'
url: https://raw.githubusercontent.com/api-evangelist/ai-image-video-amp-music-generator-design-studio-amp-canvas-/refs/heads/main/apis.yml
