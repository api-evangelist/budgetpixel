- name: BudgetPixel MCP Server
  description: First-party hosted remote Model Context Protocol server (streamable HTTP, protocol 2025-06-18) giving agents
    12 tools to generate images, video, music and sound effects on the signed-in account, upscale image and video, upload
    reference media, browse the live model catalogue and prices, read the credit balance and generation history, and publish
    to the public community feed. OAuth 2.1 + PKCE with Google SSO and dynamic client registration; no API key. Catalogue
    browsing is open to any account, generation requires Premium, Pro or Ultra.
  humanURL: https://budgetpixel.com/mcp
