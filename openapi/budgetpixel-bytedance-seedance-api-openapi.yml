  /videos/seedance-2.5:
    post:
      description: 'ByteDance SeeDance 2.5 — flagship multimodal video. Text-to-video; image-to-video (start + optional end frame); and reference-to-video mixing up to 15 reference images (free), up to 5 reference video clips (2-15s each, 30s combined — billed per second of INPUT at half the output rate, see POST /v1/cost), and up to 5 reference audio clips (30s combined, free; audio-only input is supported). Video editing and extension are reference-video modes — no separate edit endpoint. Reference media can''t be combined with start/end frames. 480p/720p/1080p, any duration 4-30 seconds, optional audio. 1080p output is H.265 (HEVC) 10-bit; 480p and 720p are H.264. A browser without a hardware HEVC decoder shows H.265 as a black frame with audio — the job status reports the codec in `video_codec`.


