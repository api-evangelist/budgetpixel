openapi: 3.2.0
info:
  contact:
    email: support@budgetpixel.com
    name: BudgetPixel Support
  description: 'The BudgetPixel developer API for programmatic image, video, music and

    sound-effect generation.'
  title: BudgetPixel Account API
  version: '2026-06-20'
servers:
- description: Production
  url: https://api.budgetpixel.com/v1
security:
- ApiKeyAuth: []
tags:
- description: Account and credit balance
  name: Account
paths:
  /account/credits:
    get:
      operationId: getCredits
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreditBalance'
          description: Current credit balance for the account.
        '401':
          $ref: '#/components/responses/Unauthorized'
      summary: Get credit balance
      tags:
      - Account
components:
  schemas:
    Error:
      properties:
        error:
          properties:
            code:
              description: Stable machine-readable code.
              example: model_not_available
              type: string
            message:
              type: string
            type:
              description: Error category.
              example: invalid_request_error
              type: string
          required:
          - type
          - code
          - message
          type: object
      required:
      - error
      type: object
    CreditBalance:
      properties:
        extra_credits:
          description: Purchased credits that don't reset monthly.
          type: integer
        monthly_limit:
          type: integer
        monthly_remaining:
          type: integer
        monthly_used:
          type: integer
        total_available:
          description: Total spendable credits (monthly remaining + extra).
          type: integer
      type: object
  responses:
    Unauthorized:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
      description: Missing or invalid API key.
  securitySchemes:
    ApiKeyAuth:
      bearerFormat: bpx_live_*
      description: 'API key as a bearer token: Authorization: Bearer bpx_live_xxx'
      scheme: bearer
      type: http
