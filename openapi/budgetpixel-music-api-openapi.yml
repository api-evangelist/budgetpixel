openapi: 3.2.0
info:
  contact:
    email: support@budgetpixel.com
    name: BudgetPixel Support
  description: 'The BudgetPixel developer API for programmatic image, video, music and

    sound-effect generation.


    Generation is **asynchronous**: you create a job, then poll its status until it

    reaches a terminal state (`succeeded` / `failed`). You are charged in credits

    only on success — never for failures, timeouts, or content blocked before

    generation.


    **Authentication.** All requests require an API key sent as a bearer token:


    Authorization: Bearer bpx_live_xxx


    Create and manage keys from your BudgetPixel account dashboard. The developer

    API is available on **every paid plan**. On the **Free** plan, API keys can call

    the free library searches only: `GET /v1/stock/images`,

    `GET /v1/stock/sound-effects` and `GET /v1/stock/music`.


    **Pricing.** API usage is metered in credits at each model''s published price

    (see `GET /v1/models`), and your plan''s model discounts and active promotions

    apply to API charges exactly as they do on the web — `POST /v1/cost` quotes

    your discounted price. Pro and Ultra plans include a daily free-models

    allowance (a shared pool of free generations per day across qualified image

    models such as FLUX 2 Klein and Qwen-Image) that covers API

    requests too — the standard price applies once the day''s pool is used.

    Other promotional free daily generations remain web/app-only. Failed

    generations are never charged.


    **Rate limits.** Requests are limited per minute: **600 requests/min per API

    key** and **1200 requests/min per source IP** (defaults; subject to tuning).

    Every response carries `X-RateLimit-Limit`, `X-RateLimit-Remaining`, and

    `X-RateLimit-Reset` (seconds until the window resets). Exceeding a limit

    returns HTTP `429` with a `Retry-After` header — wait that long before

    retrying. Rejected requests still count against the window, so a tight retry

    loop keeps you limited; back off instead. Generation jobs additionally have a

    per-plan concurrency cap (the same one as the web workshop), independent of

    these request limits. `POST /v1/uploads` also has a dedicated **60 uploads/min

    per account** cap (it''s free/unmetered) on top of these limits. Every `429`

    this API returns carries `Retry-After`, including a full concurrency queue

    (a suggested wait) and the monthly spend limit (seconds until the month

    resets).


    **Output retention.** Generated files are kept for 24 hours after the job is

    created. Job status responses give the exact time as `expires_at`; after it,

    `expired` is `true` and no download URLs are returned.'
  title: BudgetPixel Music API
  version: '2026-06-20'
servers:
- description: Production
  url: https://api.budgetpixel.com/v1
security:
- ApiKeyAuth: []
tags:
- description: Music generation models
  name: Music
paths:
  /audios/lyria-3:
    post:
      description: 'Google Lyria 3 — high-fidelity music from a text prompt, with optional lyrics and up to 10 reference images to condition the mood. MP3 output (SynthID-watermarked).


        **Asynchronous.** Returns a job `id` (the track is not in this response). Poll `GET /v1/audios/{id}` until `status` is `succeeded` — the track URL is in that response''s `audio_url`.


        Examples, sample output and pricing: Lyria 3'
      operationId: createAudio_lyria_3
      requestBody:
        content:
          application/json:
            schema:
              properties:
                images:
                  description: Optional reference images (up to 10) to condition the track's mood/theme. Each item is a public image URL, a data URI, raw base64, or an uploaded-file URL from POST /v1/uploads.
                  items:
                    type: string
                  maxItems: 10
                  type: array
                  x-bpx-media: image
                lyrics:
                  description: Optional lyrics (up to 3000 characters).
                  type: string
                prompt:
                  description: Description of the music to generate (10-2000 characters).
                  type: string
              required:
              - prompt
              type: object
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateAudioResponse'
          description: Job accepted.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      summary: Generate music with Lyria 3
      tags:
      - Music
  /audios/mureka-v9:
    post:
      description: 'Mureka V9 — songs that sing your exact lyrics (structural tags like [verse]/[chorus] supported) with a vocal gender preference, or instrumental/BGM tracks from a prompt. MP3 output.


        **Asynchronous.** Returns a job `id` (the track is not in this response). Poll `GET /v1/audios/{id}` until `status` is `succeeded` — the track URL is in that response''s `audio_url`.


        Examples, sample output and pricing: Mureka V9'
      operationId: createAudio_mureka_v9
      requestBody:
        content:
          application/json:
            schema:
              properties:
                instrumental:
                  default: false
                  description: Generate an instrumental/BGM track from the prompt (no vocals, lyrics ignored).
                  type: boolean
                lyrics:
                  description: Lyrics to sing verbatim (1-5000 characters; [verse]/[chorus]/[bridge] tags supported). Required for songs; ignored for instrumental tracks.
                  type: string
                prompt:
                  description: Style hint (up to 1024 characters). Optional for songs; required for instrumental tracks.
                  type: string
                vocal_gender:
                  default: auto
                  description: Preferred vocal gender for songs.
                  enum:
                  - auto
                  - female
                  - male
                  type: string
              type: object
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateAudioResponse'
          description: Job accepted.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      summary: Generate music with Mureka V9
      tags:
      - Music
  /audios/music-2.6:
    post:
      description: 'MiniMax Music 2.6 — full-length songs from a style prompt and/or your own lyrics. Lyrics optimizer can write or polish lyrics from the prompt; instrumental mode skips vocals. MP3 or WAV output.


        **Asynchronous.** Returns a job `id` (the track is not in this response). Poll `GET /v1/audios/{id}` until `status` is `succeeded` — the track URL is in that response''s `audio_url`.


        Examples, sample output and pricing: Music 2.6'
      operationId: createAudio_music_2_6
      requestBody:
        content:
          application/json:
            schema:
              properties:
                format:
                  default: wav
                  description: Output audio format. Defaults to wav (lossless); choose mp3 for a smaller file.
                  enum:
                  - wav
                  - mp3
                  type: string
                instrumental:
                  default: false
                  description: Generate an instrumental track (no vocals).
                  type: boolean
                lyrics:
                  description: Lyrics to sing (1-3500 characters). Required unless instrumental is true or lyrics_optimizer is true (the optimizer writes lyrics from the prompt).
                  type: string
                lyrics_optimizer:
                  default: true
                  description: Let the model write or polish lyrics from the prompt. Default true.
                  type: boolean
                prompt:
                  description: Style/mood description of the track (up to 2000 characters). Optional when lyrics are provided.
                  type: string
              type: object
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateAudioResponse'
          description: Job accepted.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      summary: Generate music with Music 2.6
      tags:
      - Music
  /audios/music-3.0:
    post:
      description: 'MiniMax Music 3.0 — the latest MiniMax music model: full-length songs from a style prompt and/or your own lyrics. Lyrics optimizer can write or polish lyrics from the prompt; instrumental mode skips vocals. WAV or MP3 output.


        **Asynchronous.** Returns a job `id` (the track is not in this response). Poll `GET /v1/audios/{id}` until `status` is `succeeded` — the track URL is in that response''s `audio_url`.


        Examples, sample output and pricing: Music 3.0'
      operationId: createAudio_music_3_0
      requestBody:
        content:
          application/json:
            schema:
              properties:
                format:
                  default: wav
                  description: Output audio format. Defaults to wav (lossless); choose mp3 for a smaller file.
                  enum:
                  - wav
                  - mp3
                  type: string
                instrumental:
                  default: false
                  description: Generate an instrumental track (no vocals).
                  type: boolean
                lyrics:
                  description: Lyrics to sing (1-3500 characters). Required unless instrumental is true or lyrics_optimizer is true (the optimizer writes lyrics from the prompt).
                  type: string
                lyrics_optimizer:
                  default: true
                  description: Let the model write or polish lyrics from the prompt. Default true.
                  type: boolean
                prompt:
                  description: Style/mood description of the track (up to 2000 characters). Optional when lyrics are provided.
                  type: string
              type: object
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateAudioResponse'
          description: Job accepted.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      summary: Generate music with Music 3.0
      tags:
      - Music
  /audios/sonilo-music:
    post:
      description: 'Sonilo text-to-music — licensed instrumental and background music of an exact length (5-360 seconds) from a text prompt: soundtracks for videos, ads, apps and games. Priced per second of the requested duration with a 10-second minimum (rate in GET /v1/models; POST /v1/cost quotes the exact price). MP3 or WAV output.


        **Asynchronous.** Returns a job `id` (the track is not in this response). Poll `GET /v1/audios/{id}` until `status` is `succeeded` — the track URL is in that response''s `audio_url`. Charged per second of the requested `duration` (10-second minimum; rate in `GET /v1/models`) on success only; `POST /v1/cost` quotes the exact price.


        Examples, sample output and pricing: Sonilo Music'
      operationId: createAudio_sonilo_music
      requestBody:
        content:
          application/json:
            schema:
              properties:
                duration:
                  default: 30
                  description: Length of the track in seconds (5-360). Billed per second with a 10-second minimum.
                  maximum: 360
                  minimum: 5
                  type: integer
                format:
                  default: mp3
                  description: Output audio format.
                  enum:
                  - mp3
                  - wav
                  type: string
                prompt:
                  description: Description of the music (up to 2000 characters; even a few words work), e.g. "30 seconds of upbeat electronic instrumental for a product launch video, no vocals".
                  type: string
              required:
              - prompt
              type: object
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateAudioResponse'
          description: Job accepted.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      summary: Generate music with Sonilo Music
      tags:
      - Music
  /audios/sonilo-video-music:
    post:
      description: 'Sonilo video-to-music — a licensed soundtrack composed for an input video (up to 6 minutes): the music follows the clip''s content, pacing and mood. Returns the music track (`audio_url`, MP3 or WAV) sized to the video. Priced per second of the input video''s measured duration (whole seconds, 10-second minimum) — see GET /v1/models for the rate.


        **Asynchronous.** Returns a job `id` (nothing is generated yet in this response). Poll `GET /v1/audios/{id}` until `status` is `succeeded` — the soundtrack is that response''s `audio_url`, sized to the input video. Charged per second of the input video''s measured duration (whole seconds, 10-second minimum; rate in `GET /v1/models`) on success only.


        Examples, sample output and pricing: Sonilo Video Music'
      operationId: createAudio_sonilo_video_music
      requestBody:
        content:
          application/json:
            schema:
              properties:
                format:
                  default: mp3
                  description: Output audio format.
                  enum:
                  - mp3
                  - wav
                  type: string
                prompt:
                  description: 'Optional direction for the music (up to 2000 characters): genre, mood, instrumentation, business context — e.g. "warm acoustic indie, builds gently, no vocals".'
                  type: string
                video:
                  description: The input video (MP4/WebM, up to 360 seconds, 30 MB remote-fetch cap). A public video URL, an uploaded-file URL from POST /v1/uploads, a data URI, or raw base64. Its duration is measured server-side and is the billing basis.
                  type: string
                  x-bpx-media: video
              required:
              - video
              type: object
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateAudioResponse'
          description: Job accepted.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      summary: Generate music with Sonilo Video Music
      tags:
      - Music
components:
  responses:
    BadRequest:
      content:
        application/json:
          schema:
            oneOf:
            - $ref: '#/components/schemas/Error'
            - $ref: '#/components/schemas/ModerationBlocked'
      description: The request was malformed, referenced an unavailable model, or was blocked by input content moderation (moderation blocks carry a `restriction_reason` — see ModerationBlocked).
    Unauthorized:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
      description: Missing or invalid API key.
    Forbidden:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
      description: Authenticated but not permitted (plan gate, ownership, account restriction). Content-moderation blocks are 400, not 403.
    TooManyRequests:
      content:
        application/json:
          schema:
            oneOf:
            - $ref: '#/components/schemas/Error'
            - $ref: '#/components/schemas/QueueFull'
      description: 'A limit was reached. Every `429` carries `Retry-After` (seconds). The

        per-minute rate limit, the upload limit and the hourly API post cap answer

        with the `Error` envelope, code `rate_limited`. The monthly spend limit answers with

        code `monthly_spend_limit_reached`, and its `Retry-After` counts down to the

        start of next month (raising the limit in the console clears it sooner).

        A full concurrency queue answers with the flat `QueueFull` body (3D jobs:

        the `Error` envelope with code `queue_full`); its `Retry-After` is a

        suggested wait, because a slot frees as soon as one of your running jobs

        finishes.

        '
      headers:
        Retry-After:
          description: Seconds to wait before retrying.
          schema:
            minimum: 1
            type: integer
  schemas:
    CreateAudioResponse:
      properties:
        id:
          description: Opaque job id — use it to poll status.
          example: aud_a1b2c3d4e5f6
          type: string
        message:
          type: string
        model:
          type: string
        status:
          $ref: '#/components/schemas/JobStatus'
      type: object
    JobStatus:
      description: Lifecycle state. `succeeded`/`failed`/`timeout` are terminal.
      enum:
      - pending
      - starting
      - processing
      - completing
      - succeeded
      - failed
      - timeout
      type: string
    Error:
      properties:
        error:
          properties:
            code:
              description: Stable machine-readable code.
              example: model_not_available
              type: string
            message:
              type: string
            type:
              description: Error category.
              example: invalid_request_error
              type: string
          required:
          - type
          - code
          - message
          type: object
      required:
      - error
      type: object
    QueueFull:
      description: '`429` body when your account already has as many jobs of this kind

        (image, video or audio) in flight as its concurrency cap allows. Submit

        the next job when one of your running jobs finishes.

        '
      properties:
        active_jobs:
          description: Jobs of this kind in flight right now.
          type: integer
        code:
          enum:
          - queue_full
          type: string
        error:
          description: Human-readable message.
          type: string
        queue_full:
          enum:
          - true
          type: boolean
        queue_limit:
          description: Your concurrency cap for this kind of job.
          type: integer
        retry_after_seconds:
          description: Same value as the `Retry-After` header.
          type: integer
      required:
      - error
      - code
      - queue_full
      - queue_limit
      - active_jobs
      - retry_after_seconds
      type: object
    ModerationBlocked:
      description: Returned (with HTTP 400) when the input content moderation gate blocks a generation request. The block is a property of the request's prompt or input media — reword the prompt or change the input and retry. Branch on `restriction_reason`, which is stable and machine-readable.
      properties:
        error:
          description: Human-readable explanation of the block.
          type: string
        restriction_reason:
          description: Stable machine-readable block reason.
          enum:
          - input_csam
          - input_explicit_adult
          - input_upload_nudity
          - input_celebrity_likeness
          - strict_model_nsfw
          type: string
      required:
      - error
      - restriction_reason
      type: object
  securitySchemes:
    ApiKeyAuth:
      bearerFormat: bpx_live_*
      description: 'API key as a bearer token: Authorization: Bearer bpx_live_xxx'
      scheme: bearer
      type: http
