openapi: 3.2.0
info:
  contact:
    email: support@budgetpixel.com
    name: BudgetPixel Support
  description: 'The BudgetPixel developer API for programmatic image, video, music and

    sound-effect generation.


    Generation is **asynchronous**: you create a job, then poll its status until it

    reaches a terminal state (`succeeded` / `failed`). You are charged in credits

    only on success — never for failures, timeouts, or content blocked before

    generation.


    **Authentication.** All requests require an API key sent as a bearer token:


    Authorization: Bearer bpx_live_xxx


    Create and manage keys from your BudgetPixel account dashboard. The developer

    API is available on **every paid plan**. On the **Free** plan, API keys can call

    the free library searches only: `GET /v1/stock/images`,

    `GET /v1/stock/sound-effects` and `GET /v1/stock/music`.


    **Pricing.** API usage is metered in credits at each model''s published price

    (see `GET /v1/models`), and your plan''s model discounts and active promotions

    apply to API charges exactly as they do on the web — `POST /v1/cost` quotes

    your discounted price. Pro and Ultra plans include a daily free-models

    allowance (a shared pool of free generations per day across qualified image

    models such as FLUX 2 Klein and Qwen-Image) that covers API

    requests too — the standard price applies once the day''s pool is used.

    Other promotional free daily generations remain web/app-only. Failed

    generations are never charged.


    **Rate limits.** Requests are limited per minute: **600 requests/min per API

    key** and **1200 requests/min per source IP** (defaults; subject to tuning).

    Every response carries `X-RateLimit-Limit`, `X-RateLimit-Remaining`, and

    `X-RateLimit-Reset` (seconds until the window resets). Exceeding a limit

    returns HTTP `429` with a `Retry-After` header — wait that long before

    retrying. Rejected requests still count against the window, so a tight retry

    loop keeps you limited; back off instead. Generation jobs additionally have a

    per-plan concurrency cap (the same one as the web workshop), independent of

    these request limits. `POST /v1/uploads` also has a dedicated **60 uploads/min

    per account** cap (it''s free/unmetered) on top of these limits. Every `429`

    this API returns carries `Retry-After`, including a full concurrency queue

    (a suggested wait) and the monthly spend limit (seconds until the month

    resets).


    **Output retention.** Generated files are kept for 24 hours after the job is

    created. Job status responses give the exact time as `expires_at`; after it,

    `expired` is `true` and no download URLs are returned.'
  title: BudgetPixel Moderation API
  version: '2026-06-20'
servers:
- description: Production
  url: https://api.budgetpixel.com/v1
security:
- ApiKeyAuth: []
tags:
- description: Content moderation — NSFW rating and CSAM detection
  name: Moderation
paths:
  /moderations/csam:
    post:
      description: 'Check text, images, and/or one video for child sexual abuse material (CSAM),

        using the same child-safety classifier and rubric BudgetPixel runs on all

        platform content. **Synchronous**: the response carries a boolean verdict,

        a confidence score, and a short reason.


        **Inputs, formats, and size caps** are identical to

        `POST /v1/moderations/nsfw`:

        `prompt`, up to 10 `images` (10 MB each), one `video` (100 MB / 5 minutes,

        5 frames sampled). At least one input is required.


        **Pricing: 2 credits base + 3 per image + 15 for a video.** Estimate via

        `POST /v1/cost` with

        `{"model": "moderation-csam", "images": 2}`. Charged on success only.


        **Child-safety notice:** submitted media is retained privately for ~1 day.

        Content our classifier flags as suspected CSAM is **preserved and escalated

        for human review**, and confirmed material is reported to the relevant

        authorities (e.g. NCMEC) with the submitting account actioned. Do not submit

        content you believe is real CSAM — report it to law enforcement instead.'
      operationId: moderateCSAM
      requestBody:
        content:
          application/json:
            schema:
              properties:
                images:
                  description: Up to 10 images (public URL, uploaded-file URL, data URI, or raw base64). Max 10 MB each.
                  items:
                    type: string
                  maxItems: 10
                  type: array
                prompt:
                  description: Text to check (alone, or as context for the media).
                  type: string
                video:
                  description: One video (public URL, uploaded-file URL, data URI, or raw base64). Max 100 MB and 5 minutes.
                  type: string
              type: object
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  confidence:
                    description: Classifier confidence, 0-1.
                    type: number
                  credits_charged:
                    type: integer
                  csam:
                    description: True when the submission is judged to be CSAM.
                    type: boolean
                  id:
                    description: Moderation request id (audit reference).
                    type: string
                  reason:
                    description: Short explanation (never a detailed description of the content).
                    type: string
                type: object
          description: The verdict.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Insufficient credits.
        '429':
          $ref: '#/components/responses/TooManyRequests'
      summary: Check content for CSAM
      tags:
      - Moderation
  /moderations/nsfw:
    post:
      description: 'Rate text, images, and/or one video on BudgetPixel''s 4-level NSFW scale —

        the same classifier and scale the platform itself moderates with.

        **Synchronous**: the response carries the verdict.


        **Levels:**

        - `0` (`sfw`) — safe for work. Non-sexual violence, action, and blood stay here.

        - `1` (`teen`) — mildly suggestive (swimwear/underwear in a non-sexual context).

        - `2` (`mature`) — partial nudity or overtly sexual posing, no genitals.

        - `3` (`x-rated`) — explicit sexual content, visible genitals, or extreme gore.


        **Inputs** (at least one required): `prompt` (text), `images` (up to 10, max 10 MB

        each), `video` (one, max 100 MB and 5 minutes — 5 frames are sampled). Media

        values accept a public URL, an uploaded-file URL from

        `POST /v1/uploads`, a data URI, or raw

        base64. Everything is downscaled before classification; the rating is for the

        submission **as a whole** (highest applicable level), with one overall `reason`.


        **Pricing: 2 credits base + 3 per image + 15 for a video.** Estimate via

        `POST /v1/cost` with

        `{"model": "moderation-nsfw", "images": 2, "video": true}`. Charged on success

        only — a classifier failure costs nothing.


        Submitted media is retained privately for ~1 day (for abuse review), then

        deleted automatically.'
      operationId: moderateNSFW
      requestBody:
        content:
          application/json:
            schema:
              properties:
                images:
                  description: Up to 10 images (public URL, uploaded-file URL, data URI, or raw base64). Max 10 MB each.
                  items:
                    type: string
                  maxItems: 10
                  type: array
                prompt:
                  description: Text to rate (alone, or as context for the media).
                  type: string
                video:
                  description: One video (public URL, uploaded-file URL, data URI, or raw base64). Max 100 MB and 5 minutes.
                  type: string
              type: object
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  confidence:
                    description: Classifier confidence, 0-1.
                    type: number
                  credits_charged:
                    type: integer
                  id:
                    description: Moderation request id (audit reference).
                    type: string
                  label:
                    enum:
                    - sfw
                    - teen
                    - mature
                    - x-rated
                    type: string
                  level:
                    description: Overall NSFW level of the submission.
                    enum:
                    - 0
                    - 1
                    - 2
                    - 3
                    type: integer
                  reason:
                    description: Short overall explanation.
                    type: string
                type: object
          description: The rating.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Insufficient credits.
        '429':
          $ref: '#/components/responses/TooManyRequests'
      summary: Rate content NSFW level
      tags:
      - Moderation
components:
  responses:
    BadRequest:
      content:
        application/json:
          schema:
            oneOf:
            - $ref: '#/components/schemas/Error'
            - $ref: '#/components/schemas/ModerationBlocked'
      description: The request was malformed, referenced an unavailable model, or was blocked by input content moderation (moderation blocks carry a `restriction_reason` — see ModerationBlocked).
    Unauthorized:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
      description: Missing or invalid API key.
    TooManyRequests:
      content:
        application/json:
          schema:
            oneOf:
            - $ref: '#/components/schemas/Error'
            - $ref: '#/components/schemas/QueueFull'
      description: 'A limit was reached. Every `429` carries `Retry-After` (seconds). The

        per-minute rate limit, the upload limit and the hourly API post cap answer

        with the `Error` envelope, code `rate_limited`. The monthly spend limit answers with

        code `monthly_spend_limit_reached`, and its `Retry-After` counts down to the

        start of next month (raising the limit in the console clears it sooner).

        A full concurrency queue answers with the flat `QueueFull` body (3D jobs:

        the `Error` envelope with code `queue_full`); its `Retry-After` is a

        suggested wait, because a slot frees as soon as one of your running jobs

        finishes.

        '
      headers:
        Retry-After:
          description: Seconds to wait before retrying.
          schema:
            minimum: 1
            type: integer
  schemas:
    Error:
      properties:
        error:
          properties:
            code:
              description: Stable machine-readable code.
              example: model_not_available
              type: string
            message:
              type: string
            type:
              description: Error category.
              example: invalid_request_error
              type: string
          required:
          - type
          - code
          - message
          type: object
      required:
      - error
      type: object
    QueueFull:
      description: '`429` body when your account already has as many jobs of this kind

        (image, video or audio) in flight as its concurrency cap allows. Submit

        the next job when one of your running jobs finishes.

        '
      properties:
        active_jobs:
          description: Jobs of this kind in flight right now.
          type: integer
        code:
          enum:
          - queue_full
          type: string
        error:
          description: Human-readable message.
          type: string
        queue_full:
          enum:
          - true
          type: boolean
        queue_limit:
          description: Your concurrency cap for this kind of job.
          type: integer
        retry_after_seconds:
          description: Same value as the `Retry-After` header.
          type: integer
      required:
      - error
      - code
      - queue_full
      - queue_limit
      - active_jobs
      - retry_after_seconds
      type: object
    ModerationBlocked:
      description: Returned (with HTTP 400) when the input content moderation gate blocks a generation request. The block is a property of the request's prompt or input media — reword the prompt or change the input and retry. Branch on `restriction_reason`, which is stable and machine-readable.
      properties:
        error:
          description: Human-readable explanation of the block.
          type: string
        restriction_reason:
          description: Stable machine-readable block reason.
          enum:
          - input_csam
          - input_explicit_adult
          - input_upload_nudity
          - input_celebrity_likeness
          - strict_model_nsfw
          type: string
      required:
      - error
      - restriction_reason
      type: object
  securitySchemes:
    ApiKeyAuth:
      bearerFormat: bpx_live_*
      description: 'API key as a bearer token: Authorization: Bearer bpx_live_xxx'
      scheme: bearer
      type: http
