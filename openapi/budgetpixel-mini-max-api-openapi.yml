openapi: 3.2.0
info:
  contact:
    email: support@budgetpixel.com
    name: BudgetPixel Support
  description: 'The BudgetPixel developer API for programmatic image, video, music and

    sound-effect generation.


    Generation is **asynchronous**: you create a job, then poll its status until it

    reaches a terminal state (`succeeded` / `failed`). You are charged in credits

    only on success — never for failures, timeouts, or content blocked before

    generation.


    **Authentication.** All requests require an API key sent as a bearer token:


    Authorization: Bearer bpx_live_xxx


    Create and manage keys from your BudgetPixel account dashboard. The developer

    API is available on **every paid plan**. On the **Free** plan, API keys can call

    the free library searches only: `GET /v1/stock/images`,

    `GET /v1/stock/sound-effects` and `GET /v1/stock/music`.


    **Pricing.** API usage is metered in credits at each model''s published price

    (see `GET /v1/models`), and your plan''s model discounts and active promotions

    apply to API charges exactly as they do on the web — `POST /v1/cost` quotes

    your discounted price. Pro and Ultra plans include a daily free-models

    allowance (a shared pool of free generations per day across qualified image

    models such as FLUX 2 Klein and Qwen-Image) that covers API

    requests too — the standard price applies once the day''s pool is used.

    Other promotional free daily generations remain web/app-only. Failed

    generations are never charged.


    **Rate limits.** Requests are limited per minute: **600 requests/min per API

    key** and **1200 requests/min per source IP** (defaults; subject to tuning).

    Every response carries `X-RateLimit-Limit`, `X-RateLimit-Remaining`, and

    `X-RateLimit-Reset` (seconds until the window resets). Exceeding a limit

    returns HTTP `429` with a `Retry-After` header — wait that long before

    retrying. Rejected requests still count against the window, so a tight retry

    loop keeps you limited; back off instead. Generation jobs additionally have a

    per-plan concurrency cap (the same one as the web workshop), independent of

    these request limits. `POST /v1/uploads` also has a dedicated **60 uploads/min

    per account** cap (it''s free/unmetered) on top of these limits. Every `429`

    this API returns carries `Retry-After`, including a full concurrency queue

    (a suggested wait) and the monthly spend limit (seconds until the month

    resets).


    **Output retention.** Generated files are kept for 24 hours after the job is

    created. Job status responses give the exact time as `expires_at`; after it,

    `expired` is `true` and no download URLs are returned.'
  title: BudgetPixel Mini Max API
  version: '2026-06-20'
servers:
- description: Production
  url: https://api.budgetpixel.com/v1
security:
- ApiKeyAuth: []
tags:
- name: Mini Max
paths:
  /videos/minimax-h3:
    post:
      description: 'MiniMax H3 — multimodal 2K video. Text-to-video; image-to-video (start + optional end frame); and reference-to-video mixing up to 5 reference images, up to 3 reference video clips (2-15s each, 15s combined — billed per second of INPUT on top of the output, see POST /v1/cost), and up to 3 reference audio clips (15s combined, free). Reference media can''t be combined with start/end frames. Any duration from 4 to 15 seconds.


        **Asynchronous.** Returns a job `id` (the video is not in this response). Poll `GET /v1/videos/{id}` until `status` is `succeeded` — the video URL is in that response''s `video_url`.


        Examples, sample output and pricing: MiniMax H3'
      operationId: createVideo_minimax_h3
      requestBody:
        content:
          application/json:
            schema:
              properties:
                aspect_ratio:
                  default: '16:9'
                  description: Aspect ratio for text-to-video. Ignored (adaptive) when any image or reference input sets the frame.
                  enum:
                  - '21:9'
                  - '16:9'
                  - '9:16'
                  - '1:1'
                  - '4:3'
                  - '3:4'
                  type: string
                end_image:
                  description: Optional end frame, used together with `image` (the start frame) to interpolate the video between the two frames. Same input forms as `image`.
                  type: string
                  x-bpx-media: image
                image:
                  description: Optional start frame for image-to-video. Provide a public image URL, a data URI, raw base64, or an uploaded-file URL from POST /v1/uploads. Omit for text-to-video. Can't be combined with reference media.
                  type: string
                  x-bpx-media: image
                length_seconds:
                  default: 5
                  description: Output video length in seconds (4-15).
                  maximum: 15
                  minimum: 4
                  type: integer
                prompt:
                  description: Text description of the video.
                  type: string
                reference_audios:
                  description: Optional reference audio clips (up to 3; each 2-15s, 15s combined; WAV/MP3) that guide sound/voice in reference-to-video mode. Each item is a public audio URL or an uploaded-file URL from POST /v1/uploads. Free — no input billing. Can't be combined with `image`/`end_image`.
                  items:
                    type: string
                  maxItems: 3
                  type: array
                  x-bpx-media: audio
                reference_images:
                  description: Optional reference images (up to 5) that guide identity/style in reference-to-video mode. Each item is a public image URL, a data URI, raw base64, or an uploaded-file URL from POST /v1/uploads. Can't be combined with `image`/`end_image`.
                  items:
                    type: string
                  maxItems: 5
                  type: array
                  x-bpx-media: image
                reference_videos:
                  description: Optional reference video clips (up to 3; each 2-15s, 15s combined; MP4/WebM, ≤30MB each) that guide motion/identity in reference-to-video mode. Each item is a public video URL or an uploaded-file URL from POST /v1/uploads (videos are passed by URL, not inlined). Billed at the model's per-second rate on the INPUT duration in addition to the output — estimate via POST /v1/cost. Can't be combined with `image`/`end_image`.
                  items:
                    type: string
                  maxItems: 3
                  type: array
                  x-bpx-media: video
              required:
              - prompt
              type: object
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateVideoResponse'
          description: Job accepted.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      summary: Generate video with MiniMax H3
      tags:
      - Mini Max
  /videos/minimax-h3-max:
    post:
      description: 'MiniMax H3 Max — the post-trained H3 variant tuned for stronger prompt adherence and aesthetics, with native audio. Text-to-video; image-to-video (start and/or end frame); reference-to-video mixing up to 5 reference images, up to 3 reference video clips (2-15s each, 15s combined — billed per second of INPUT, see POST /v1/cost) and up to 3 reference audio clips (free); and video extension (supply a `video` to continue it). 480p/768p/1080p (2K when extending), any duration 5-15 seconds. Priced per output second by resolution (see `resolution_pricing` in GET /v1/models); reference images beyond the first two add a small per-image charge.


        **Asynchronous.** Returns a job `id` (the video is not in this response). Poll `GET /v1/videos/{id}` until `status` is `succeeded` — the video URL is in that response''s `video_url`.


        Examples, sample output and pricing: MiniMax H3 Max'
      operationId: createVideo_minimax_h3_max
      requestBody:
        content:
          application/json:
            schema:
              properties:
                aspect_ratio:
                  description: 'Aspect ratio. Text-to-video uses it directly; image-to-video follows the frame image and ignores it; reference-to-video also accepts "adaptive" (the default there); extension accepts "auto" (follow the source — the default there) or a ratio to crop to. Defaults: 16:9 for text-to-video.'
                  enum:
                  - '16:9'
                  - '9:16'
                  - '1:1'
                  - '4:3'
                  - '3:4'
                  - '21:9'
                  - adaptive
                  - auto
                  type: string
                audio:
                  description: 'Optional soundtrack (≥2s, ≤15MB, MP3/WAV) pinned to a text-to-video or image-to-video output: it replaces the generated audio, trimmed to the video length. Provide a public audio URL or an uploaded-file URL from POST /v1/uploads. Not available with reference media or `video`.'
                  type: string
                  x-bpx-media: audio
                end_image:
                  description: Optional last frame. With `image` the video interpolates between the two frames; on its own it is an end-keyframe generation. Same input forms as `image`.
                  type: string
                  x-bpx-media: image
                image:
                  description: Optional first frame for image-to-video — the output follows its framing. Provide a public image URL, a data URI, raw base64, or an uploaded-file URL from POST /v1/uploads. Can't be combined with reference media or `video`.
                  type: string
                  x-bpx-media: image
                length_seconds:
                  default: 5
                  description: Output length in seconds (5-15). When extending, the seconds of NEW footage appended to the source.
                  maximum: 15
                  minimum: 5
                  type: integer
                prompt:
                  description: 'Text description of the video. In reference mode, address assets by order: "Image 1", "Video 1", "Audio 1". When extending, describe what happens next, not the source.'
                  type: string
                reference_audios:
                  description: Optional reference audio clips (up to 3; each 2-15s, 15s combined; WAV/MP3) for sound/voice guidance, addressed as "Audio 1"… Each item is a public audio URL or an uploaded-file URL from POST /v1/uploads. Free. Can't be combined with `image`/`end_image`.
                  items:
                    type: string
                  maxItems: 3
                  type: array
                  x-bpx-media: audio
                reference_images:
                  description: Optional reference images (up to 5) for subjects/style in reference-to-video mode, addressed in the prompt as "Image 1", "Image 2"… The first two are free; each additional image adds 50 credits. Each item is a public image URL, a data URI, raw base64, or an uploaded-file URL from POST /v1/uploads. Can't be combined with `image`/`end_image`.
                  items:
                    type: string
                  maxItems: 5
                  type: array
                  x-bpx-media: image
                reference_videos:
                  description: Optional reference video clips (up to 3; each 2-15s, 15s combined; MP4/MOV, ≤50MB each) for motion/identity guidance, addressed as "Video 1"… Each item is a public video URL or an uploaded-file URL from POST /v1/uploads (passed by URL, not inlined). Billed at 170 credits per second of INPUT on top of the output — estimate via POST /v1/cost. Can't be combined with `image`/`end_image`.
                  items:
                    type: string
                  maxItems: 3
                  type: array
                  x-bpx-media: video
                resolution:
                  default: 768p
                  description: Output resolution. Pricing varies by resolution — see `resolution_pricing` in GET /v1/models. 2k is only available when extending a `video`.
                  enum:
                  - 480p
                  - 768p
                  - 1080p
                  - 2k
                  type: string
                seed:
                  description: Seed for reproducible generation. Omit for random.
                  type: integer
                video:
                  description: Optional video to EXTEND (1.6-60s, ≤50MB, aspect ratio between 2:5 and 5:2). The model continues it for `length_seconds` of new footage guided by `prompt`, and the output is the source followed by the continuation. Provide a public video URL or an uploaded-file URL from POST /v1/uploads. Can't be combined with any other media input. The source is billed at 170 credits per second (first 15 seconds) — estimate via POST /v1/cost.
                  type: string
                  x-bpx-media: video
              required:
              - prompt
              type: object
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateVideoResponse'
          description: Job accepted.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      summary: Generate video with MiniMax H3 Max
      tags:
      - Mini Max
components:
  responses:
    BadRequest:
      content:
        application/json:
          schema:
            oneOf:
            - $ref: '#/components/schemas/Error'
            - $ref: '#/components/schemas/ModerationBlocked'
      description: The request was malformed, referenced an unavailable model, or was blocked by input content moderation (moderation blocks carry a `restriction_reason` — see ModerationBlocked).
    Unauthorized:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
      description: Missing or invalid API key.
    Forbidden:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
      description: Authenticated but not permitted (plan gate, ownership, account restriction). Content-moderation blocks are 400, not 403.
    TooManyRequests:
      content:
        application/json:
          schema:
            oneOf:
            - $ref: '#/components/schemas/Error'
            - $ref: '#/components/schemas/QueueFull'
      description: 'A limit was reached. Every `429` carries `Retry-After` (seconds). The

        per-minute rate limit, the upload limit and the hourly API post cap answer

        with the `Error` envelope, code `rate_limited`. The monthly spend limit answers with

        code `monthly_spend_limit_reached`, and its `Retry-After` counts down to the

        start of next month (raising the limit in the console clears it sooner).

        A full concurrency queue answers with the flat `QueueFull` body (3D jobs:

        the `Error` envelope with code `queue_full`); its `Retry-After` is a

        suggested wait, because a slot frees as soon as one of your running jobs

        finishes.

        '
      headers:
        Retry-After:
          description: Seconds to wait before retrying.
          schema:
            minimum: 1
            type: integer
  schemas:
    CreateVideoResponse:
      properties:
        id:
          description: Opaque job id — use it to poll status.
          type: string
        message:
          type: string
        model:
          type: string
        status:
          $ref: '#/components/schemas/JobStatus'
      type: object
    JobStatus:
      description: Lifecycle state. `succeeded`/`failed`/`timeout` are terminal.
      enum:
      - pending
      - starting
      - processing
      - completing
      - succeeded
      - failed
      - timeout
      type: string
    Error:
      properties:
        error:
          properties:
            code:
              description: Stable machine-readable code.
              example: model_not_available
              type: string
            message:
              type: string
            type:
              description: Error category.
              example: invalid_request_error
              type: string
          required:
          - type
          - code
          - message
          type: object
      required:
      - error
      type: object
    QueueFull:
      description: '`429` body when your account already has as many jobs of this kind

        (image, video or audio) in flight as its concurrency cap allows. Submit

        the next job when one of your running jobs finishes.

        '
      properties:
        active_jobs:
          description: Jobs of this kind in flight right now.
          type: integer
        code:
          enum:
          - queue_full
          type: string
        error:
          description: Human-readable message.
          type: string
        queue_full:
          enum:
          - true
          type: boolean
        queue_limit:
          description: Your concurrency cap for this kind of job.
          type: integer
        retry_after_seconds:
          description: Same value as the `Retry-After` header.
          type: integer
      required:
      - error
      - code
      - queue_full
      - queue_limit
      - active_jobs
      - retry_after_seconds
      type: object
    ModerationBlocked:
      description: Returned (with HTTP 400) when the input content moderation gate blocks a generation request. The block is a property of the request's prompt or input media — reword the prompt or change the input and retry. Branch on `restriction_reason`, which is stable and machine-readable.
      properties:
        error:
          description: Human-readable explanation of the block.
          type: string
        restriction_reason:
          description: Stable machine-readable block reason.
          enum:
          - input_csam
          - input_explicit_adult
          - input_upload_nudity
          - input_celebrity_likeness
          - strict_model_nsfw
          type: string
      required:
      - error
      - restriction_reason
      type: object
  securitySchemes:
    ApiKeyAuth:
      bearerFormat: bpx_live_*
      description: 'API key as a bearer token: Authorization: Bearer bpx_live_xxx'
      scheme: bearer
      type: http
