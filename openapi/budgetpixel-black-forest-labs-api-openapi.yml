  /images/flux-3-image:
    post:
      description: 'Black Forest Labs FLUX 3 — text-to-image and image editing in one model. Edit or compose from up to 10 reference images (free), render at five sizes from 768px to 4K, and optionally let the model ground the prompt with web and image search. Billing: per image by size — 768px = 55, 1K = 65, 1.5K = 90, 2K = 130, 4K = 790 credits. Use POST /v1/cost for an exact quote.


        **Asynchronous.** Returns a job `id` (the image is not in this response). Poll `GET /v1/images/{id}` until `status` is `succeeded` — the generated image URLs are in that response''s `images` array (each `{ url, position }`).


        Examples, sample output and pricing: FLUX 3'
      operationId: createImage_flux_3_image
      requestBody:
        content:
          application/json:
            schema:
              properties:
                aspect_ratio:
                  default: auto
                  description: Output aspect ratio. "auto" (default) follows the first reference image when editing, or lets the model pick a ratio from the prompt for text-to-image.
                  enum:
                  - auto
                  - '1:1'
                  - '16:9'
                  - '9:16'
                  - '4:3'
                  - '3:4'
                  - '3:2'
                  - '2:3'
                  - '5:4'
                  - '4:5'
                  - '2:1'
                  - '1:2'
                  - '21:9'
                  - '9:21'
                  type: string
                grounding:
                  default: true
                  description: Let the model research the prompt with web and image search before rendering (default true). Set false for faster, self-contained generation. Costs nothing extra.
                  type: boolean
                num_images:
                  default: 1
                  description: Number of images to generate. Each image is billed at its size's price.
                  maximum: 4
                  minimum: 1
                  type: integer
                prompt:
                  description: Text description of the image to generate, or of the edit to apply to the reference images.
                  type: string
                reference_images:
                  description: Optional reference images (up to 10) for image editing and multi-reference composition. Each item is a public image URL, a data URI, raw base64, or an uploaded-file URL from POST /v1/uploads. Omit for text-to-image. Reference images cost nothing extra.
                  items:
                    type: string
                  maxItems: 10
                  type: array
                  x-bpx-media: image
                size:
                  default: 1K
                  description: 'Output size by approximate pixel count: 768px ≈ 0.6 MP, 1K ≈ 1 MP, 1.5K ≈ 2 MP, 2K ≈ 4 MP, 4K ≈ 16 MP. Sets the price: 55 / 65 / 90 / 130 / 790 credits per image. 4K is returned as a JPEG, smaller sizes as PNG.'
                  enum:
                  - 768px
                  - 1K
                  - 1.5K
                  - 2K
                  - 4K
                  type: string
              required:
              - prompt
              type: object
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateImageResponse'
          description: Job accepted.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      summary: Generate image with FLUX 3
      tags:
      - Black Forest Labs
  /images/flux-3-image-klein:
    post:
      description: 'Black Forest Labs FLUX 3 Klein — the fast, low-cost FLUX 3: text-to-image and image editing in one model, with up to 10 reference images (free) and five sizes from 768px to 4K. Billing: per image by size — 768px = 11, 1K = 12, 1.5K = 15, 2K = 19, 4K = 48 credits. Use POST /v1/cost for an exact quote.


        **Asynchronous.** Returns a job `id` (the image is not in this response). Poll `GET /v1/images/{id}` until `status` is `succeeded` — the generated image URLs are in that response''s `images` array (each `{ url, position }`).


        Examples, sample output and pricing: FLUX 3 Klein'
      operationId: createImage_flux_3_image_klein
      requestBody:
        content:
          application/json:
            schema:
              properties:
                aspect_ratio:
