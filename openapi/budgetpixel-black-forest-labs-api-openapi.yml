                  - '1:1'
                  - '16:9'
                  - '9:16'
                  - '4:3'
                  - '3:4'
                  - '3:2'
                  - '2:3'
                  - '5:4'
                  - '4:5'
                  - '2:1'
                  - '1:2'
                  - '21:9'
                  - '9:21'
                  type: string
                num_images:
                  default: 1
                  description: Number of images to generate. Each image is billed at its size's price.
                  maximum: 4
                  minimum: 1
                  type: integer
                prompt:
                  description: Text description of the image to generate, or of the edit to apply to the reference images.
                  type: string
                reference_images:
                  description: Optional reference images (up to 10) for image editing and multi-reference composition. Each item is a public image URL, a data URI, raw base64, or an uploaded-file URL from POST /v1/uploads. Omit for text-to-image. Reference images cost nothing extra.
                  items:
                    type: string
                  maxItems: 10
                  type: array
                  x-bpx-media: image
                size:
                  default: 1K
                  description: 'Output size by approximate pixel count: 768px ≈ 0.6 MP, 1K ≈ 1 MP, 1.5K ≈ 2 MP, 2K ≈ 4 MP, 4K ≈ 16 MP. Sets the price: 11 / 12 / 15 / 19 / 48 credits per image. 4K is returned as a JPEG, smaller sizes as PNG.'
                  enum:
                  - 768px
                  - 1K
                  - 1.5K
                  - 2K
                  - 4K
                  type: string
              required:
              - prompt
              type: object
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateImageResponse'
          description: Job accepted.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      summary: Generate image with FLUX 3 Klein
      tags:
      - Black Forest Labs
  /videos/flux-3-video:
    post:
      description: 'Black Forest Labs FLUX 3 Video, with generated audio (sound effects, ambience, and dialogue with lip sync). Text-to-video; image-to-video from a first frame, or a first and a last frame; and video extension (supply a `video` to continue it from its last frames: the result is your clip followed by the new footage). 720p, 1080p, 1440p or 4K at 24 fps; 5-20 seconds (an extension adds 5-15). Billed per second of output by resolution, an extension at its own rate (the source clip is not billed): see `mode_pricing` in GET /v1/models or POST /v1/cost.


        **Asynchronous.** Returns a job `id` (the video is not in this response). Poll `GET /v1/videos/{id}` until `status` is `succeeded` — the video URL is in that response''s `video_url`.


        Examples, sample output and pricing: FLUX 3 Video'
      operationId: createVideo_flux_3_video
      requestBody:
        content:
          application/json:
            schema:
              properties:
                aspect_ratio:
                  default: '16:9'
                  description: Aspect ratio for text-to-video. With `image` or `video` the picture sets the shape and this is ignored.
                  enum:
                  - '16:9'
                  - '9:16'
                  - '1:1'
                  - '4:3'
                  - '3:4'
                  - '21:9'
                  - '2:1'
                  - '9:21'
                  type: string
                end_image:
                  description: 'Optional last frame, used together with `image`: the video moves from the first frame to this one. Same input forms as `image`.'
                  type: string
                  x-bpx-media: image
                generate_audio:
                  default: true
                  description: Generate sound with the video (default true; no price impact). false makes a silent clip.
                  type: boolean
                image:
                  description: Optional first frame for image-to-video; the video starts from it and follows its shape. Provide a public image URL, a data URI, raw base64, or an uploaded-file URL from POST /v1/uploads. Can't be combined with `video`.
                  type: string
                  x-bpx-media: image
                length_seconds:
                  default: 5
                  description: Video length in seconds, any whole number from 5 to 20. When extending, the seconds of NEW footage, 5 to 15.
                  maximum: 20
                  minimum: 5
                  type: integer
                prompt:
                  description: Text description of the video, including the sound you want (a line in quotes is spoken). When extending, describe what happens next, not the source.
                  type: string
                resolution:
                  default: 720p
                  description: 'Output resolution: 720p (1280x704 at 16:9), 1080p (1920x1088), 1440p (2560x1440) or 4k (3840x2176). Sets the price per second, see `mode_pricing` in GET /v1/models.'
                  enum:
                  - 720p
                  - 1080p
                  - 1440p
                  - 4k
                  type: string
                video:
                  description: Optional video to EXTEND (MP4 or MOV, 1 second to 2 minutes, up to 100MB). The model continues it from its last frames for `length_seconds` of new footage guided by `prompt`, and the result is the source followed by the continuation, at the chosen `resolution`. Provide a public video URL or an uploaded-file URL from POST /v1/uploads. Can't be combined with `image`/`end_image`. Only the new seconds are billed, at the extend rate.
                  type: string
                  x-bpx-media: video
              required:
              - prompt
              type: object
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateVideoResponse'
          description: Job accepted.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      summary: Generate video with FLUX 3 Video
      tags:
      - Black Forest Labs
components:
  responses:
    BadRequest:
      content:
        application/json:
          schema:
            oneOf:
            - $ref: '#/components/schemas/Error'
            - $ref: '#/components/schemas/ModerationBlocked'
      description: The request was malformed, referenced an unavailable model, or was blocked by input content moderation (moderation blocks carry a `restriction_reason` — see ModerationBlocked).
    Unauthorized:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
      description: Missing or invalid API key.
    Forbidden:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
      description: Authenticated but not permitted (plan gate, ownership, account restriction). Content-moderation blocks are 400, not 403.
    TooManyRequests:
      content:
        application/json:
          schema:
            oneOf:
            - $ref: '#/components/schemas/Error'
            - $ref: '#/components/schemas/QueueFull'
      description: 'A limit was reached. Every `429` carries `Retry-After` (seconds). The

        per-minute rate limit, the upload limit and the hourly API post cap answer

        with the `Error` envelope, code `rate_limited`. The monthly spend limit answers with

        code `monthly_spend_limit_reached`, and its `Retry-After` counts down to the

        start of next month (raising the limit in the console clears it sooner).

        A full concurrency queue answers with the flat `QueueFull` body (3D jobs:

        the `Error` envelope with code `queue_full`); its `Retry-After` is a

        suggested wait, because a slot frees as soon as one of your running jobs

        finishes.

        '
      headers:
        Retry-After:
          description: Seconds to wait before retrying.
          schema:
            minimum: 1
            type: integer
  schemas:
    CreateVideoResponse:
      properties:
        id:
          description: Opaque job id — use it to poll status.
          type: string
        message:
          type: string
        model:
          type: string
        status:
          $ref: '#/components/schemas/JobStatus'
      type: object
    CreateImageResponse:
      properties:
        id:
          description: Opaque job id — use it to poll status.
          example: img_a1b2c3d4e5f6
          type: string
        message:
          type: string
        model:
          type: string
        status:
          $ref: '#/components/schemas/JobStatus'
      type: object
    JobStatus:
      description: Lifecycle state. `succeeded`/`failed`/`timeout` are terminal.
      enum:
      - pending
      - starting
      - processing
      - completing
      - succeeded
      - failed
      - timeout
      type: string
    Error:
      properties:
        error:
          properties:
            code:
              description: Stable machine-readable code.
              example: model_not_available
              type: string
            message:
              type: string
            type:
              description: Error category.
              example: invalid_request_error
              type: string
          required:
          - type
          - code
          - message
          type: object
      required:
      - error
      type: object
    QueueFull:
      description: '`429` body when your account already has as many jobs of this kind

        (image, video or audio) in flight as its concurrency cap allows. Submit

        the next job when one of your running jobs finishes.

        '
      properties:
        active_jobs:
          description: Jobs of this kind in flight right now.
          type: integer
        code:
          enum:
          - queue_full
          type: string
        error:
          description: Human-readable message.
          type: string
        queue_full:
          enum:
          - true
          type: boolean
        queue_limit:
          description: Your concurrency cap for this kind of job.
          type: integer
        retry_after_seconds:
          description: Same value as the `Retry-After` header.
          type: integer
      required:
      - error
      - code
      - queue_full
      - queue_limit
      - active_jobs
      - retry_after_seconds
      type: object
    ModerationBlocked:
      description: Returned (with HTTP 400) when the input content moderation gate blocks a generation request. The block is a property of the request's prompt or input media — reword the prompt or change the input and retry. Branch on `restriction_reason`, which is stable and machine-readable.
      properties:
        error:
          description: Human-readable explanation of the block.
          type: string
        restriction_reason:
          description: Stable machine-readable block reason.
          enum:
          - input_csam
          - input_explicit_adult
          - input_upload_nudity
          - input_celebrity_likeness
          - strict_model_nsfw
