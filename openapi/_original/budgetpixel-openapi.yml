                                    items:
                                        type: string
                                    maxItems: 10
                                    type: array
                                    x-bpx-media: image
                                reference_videos:
                                    description: Optional reference video clips (up to 5; each 2-15s, 15s combined; MP4/MOV, ≤50MB each) for editing, effect/camera replication, and extension. Each item is a public video URL or an uploaded-file URL from POST /v1/uploads (videos are passed by URL, not inlined). Free — only OUTPUT seconds are billed — but input video duration + `length_seconds` must not exceed 30. Can't be combined with `image`/`end_image`.
                                    items:
                                        type: string
                                    maxItems: 5
