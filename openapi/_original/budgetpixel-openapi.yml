                - in: query
                  name: category
                  schema:
                    enum:
                        - nature
                        - animals
                        - food
                        - travel
                        - transportation
                        - architecture
                        - business
                        - industry
                        - technology
                        - people
                        - education
                        - music
                        - art
                        - backgrounds
                        - wallpapers
                        - textures
                        - abstract
                        - holidays
                        - science
                        - health
                        - sports
                    type: string
                - in: query
                  name: orientation
                  schema:
                    enum:
                        - landscape
                        - portrait
                        - square
                    type: string
                - description: Dominant colour.
                  in: query
                  name: color
                  schema:
                    enum:
                        - red
                        - orange
                        - yellow
                        - green
                        - turquoise
                        - blue
                        - purple
                        - pink
                        - white
                        - gray
                        - black
                        - brown
                    type: string
                - description: '`photo` for photographs; `illustration` for everything else (illustration, 3D, painting, vector).'
                  in: query
                  name: type
                  schema:
                    enum:
                        - photo
                        - illustration
                    type: string
                - description: '`true` returns cut-outs only: PNG files with a transparent background, for stickers, overlays and compositing. Leave it out for every image.'
                  in: query
                  name: transparent
                  schema:
                    type: boolean
                - description: '`popular` (default — with a query, best matches first), `newest`, or `top` (highest rated).'
                  in: query
                  name: sort
                  schema:
                    default: popular
                    enum:
                        - popular
                        - newest
                        - top
                    type: string
                - in: query
                  name: limit
                  schema:
                    default: 20
                    maximum: 20
                    minimum: 1
                    type: integer
                - description: Results to skip. The next page is `offset + limit`; each page is a new search.
                  in: query
                  name: offset
                  schema:
                    default: 0
                    maximum: 5000
                    minimum: 0
                    type: integer
            responses:
                "200":
                    content:
                        application/json:
                            schema:
