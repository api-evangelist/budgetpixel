components:
    responses:
        BadRequest:
            content:
                application/json:
                    schema:
                        oneOf:
                            - $ref: '#/components/schemas/Error'
                            - $ref: '#/components/schemas/ModerationBlocked'
            description: The request was malformed, referenced an unavailable model, or was blocked by input content moderation (moderation blocks carry a `restriction_reason` — see ModerationBlocked).
        Forbidden:
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/Error'
            description: Authenticated but not permitted (plan gate, ownership, account restriction). Content-moderation blocks are 400, not 403.
        NotFound:
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/Error'
            description: The requested job was not found.
        TooManyRequests:
            content:
                application/json:
                    schema:
                        oneOf:
                            - $ref: '#/components/schemas/Error'
                            - $ref: '#/components/schemas/QueueFull'
            description: |
                A limit was reached. Every `429` carries `Retry-After` (seconds). The
                per-minute rate limit, the upload limit and the hourly API post cap answer
                with the `Error` envelope, code `rate_limited`. The monthly spend limit answers with
                code `monthly_spend_limit_reached`, and its `Retry-After` counts down to the
                start of next month (raising the limit in the console clears it sooner).
                A full concurrency queue answers with the flat `QueueFull` body (3D jobs:
                the `Error` envelope with code `queue_full`); its `Retry-After` is a
                suggested wait, because a slot frees as soon as one of your running jobs
                finishes.
            headers:
                Retry-After:
                    description: Seconds to wait before retrying.
                    schema:
                        minimum: 1
                        type: integer
        Unauthorized:
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/Error'
            description: Missing or invalid API key.
    schemas:
        AudioJob:
            properties:
                audio_url:
                    description: The generated track or sound effect (signed URL, valid at least 6 hours); present once `status=succeeded`, until `expired` is `true`.
                    format: uri
                    type: string
                completed_at:
                    description: When the job finished. Present once `status` is `succeeded` or `failed` (absent on jobs from before this field was added, October 2026).
                    format: date-time
                    type: string
                created_at:
                    description: When the job was submitted.
                    format: date-time
                    type: string
                error:
                    type: string
                expired:
                    description: Present once `status=succeeded`. `true` after `expires_at`; no URLs are returned then.
                    type: boolean
                expires_at:
                    description: Present once `status=succeeded`. When the outputs are deleted, 24 hours after `created_at`.
                    format: date-time
                    type: string
                id:
                    example: aud_a1b2c3d4e5f6
                    type: string
                model:
                    type: string
                prompt:
                    description: The prompt exactly as you submitted it; absent for lyrics-only songs.
                    type: string
                started_at:
                    description: When processing started, i.e. when the job left the queue. Absent on jobs from before this field was added (October 2026).
                    format: date-time
                    type: string
                status:
                    $ref: '#/components/schemas/JobStatus'
                video_url:
                    description: Video-to-sound-effect jobs only — the input video with the generated effects mixed in (signed URL, valid at least 6 hours); present once `status=succeeded`, until `expired` is `true`.
                    format: uri
                    type: string
            type: object
        ConvertResponse:
            description: A completed format conversion. Download from `url`.
            properties:
                content_type:
                    example: image/webp
                    type: string
                credits_charged:
                    description: Credits charged for this conversion (2 image / 10 video / 3 audio).
                    type: integer
                filename:
                    description: Suggested download filename.
                    example: photo.webp
                    type: string
                retention:
                    example: 7 days
                    type: string
                size_bytes:
                    description: Converted file size in bytes.
                    type: integer
                url:
                    description: Signed download URL for the converted file (valid several hours; the file itself is kept 7 days).
                    format: uri
                    type: string
            type: object
        CostEstimate:
            description: The credit cost of a request. The real charge is always ≤ `credits` (failures cost nothing; sequential image jobs may use fewer images).
            properties:
                credits:
                    description: Credits the request will cost — the maximum, for non-deterministic cases.
                    example: 2750
                    type: integer
                exact:
                    description: True when the cost is exact; false when `credits` is an upper bound (e.g. seedream sequential, where the model picks the image count).
                    type: boolean
                model:
                    example: seedance-2.0
                    type: string
                type:
                    enum:
                        - image
                        - video
                        - audio
                        - conversion
                        - social
                        - moderation
                        - classification
                        - motion
                        - lip-sync
                        - upscale
                        - video-upscale
                    type: string
            required:
                - model
                - type
                - credits
                - exact
            type: object
        CreateAudioResponse:
            properties:
                id:
                    description: Opaque job id — use it to poll status.
                    example: aud_a1b2c3d4e5f6
                    type: string
                message:
                    type: string
                model:
                    type: string
                status:
                    $ref: '#/components/schemas/JobStatus'
            type: object
        CreateDepthMapResponse:
            properties:
                credits:
                    charged when it succeeds.: null
                    description: Total price of this job (seconds x the size's per-second rate). Held now
                    type: integer
                id:
                    description: Opaque job id (`dpt_...`) — use it to poll status.
                    type: string
                message:
                    type: string
                model:
                    type: string
                seconds:
                    description: Billed duration — the input video's length, rounded up to whole seconds, at least 5.
                    type: integer
                size:
                    description: The model size the job runs at.
                    enum:
                        - small
                        - base
                        - large
                    type: string
                status:
                    $ref: '#/components/schemas/JobStatus'
            type: object
        CreateImageResponse:
            properties:
                id:
                    description: Opaque job id — use it to poll status.
                    example: img_a1b2c3d4e5f6
                    type: string
                message:
                    type: string
                model:
                    type: string
                status:
                    $ref: '#/components/schemas/JobStatus'
            type: object
        CreateModel3DResponse:
            properties:
                credits:
                    description: Credits this job will charge on success (held until it finishes).
                    type: integer
                id:
                    description: Opaque job id — use it to poll status.
                    type: string
                message:
                    type: string
                model:
                    type: string
                status:
                    $ref: '#/components/schemas/JobStatus'
            type: object
        CreateMotionResponse:
            properties:
                credits:
                    description: Total price of this job (seconds x the model's per-second rate).
                    type: integer
                id:
                    description: Opaque job id (`mtn_...`) — use it to poll status.
                    type: string
                message:
                    type: string
                model:
                    type: string
                seconds:
                    description: Billed duration — the reference video's length, rounded up.
                    type: integer
                status:
                    $ref: '#/components/schemas/JobStatus'
            type: object
        CreatePostResponse:
            description: A published post.
            properties:
                credits_charged:
                    example: 10
                    type: integer
                id:
                    description: The post id.
                    type: integer
                license:
                    description: The content license the post was published under.
                    enum:
                        - arr
                        - cc-by
                        - cc0
                    example: arr
                    type: string
                media_type:
                    enum:
                        - image
                        - video
                        - audio
                    type: string
                moderation:
                    description: Image/video posts are rated after publish; feed visibility follows the review.
                    example: pending
                    type: string
                theme:
                    description: Present only when the post was entered in a theme (`theme_id`).
                    properties:
                        id:
                            example: 75
                            type: integer
                        title:
                            example: Neon Noir
                            type: string
                        url:
                            example: https://budgetpixel.com/themes/75
                            format: uri
                            type: string
                    type: object
                url:
                    description: Public URL of the post.
                    example: https://budgetpixel.com/p/12345
                    format: uri
                    type: string
            type: object
        CreateUpscaleResponse:
            properties:
                credits:
                    description: Total price of this job (flat per image, or the target-resolution tier for p-image-upscale).
                    type: integer
                id:
                    description: Opaque job id — use it to poll status.
                    type: string
                message:
                    type: string
                model:
                    type: string
                status:
                    $ref: '#/components/schemas/JobStatus'
            type: object
        CreateVideoResponse:
            properties:
                id:
                    description: Opaque job id — use it to poll status.
                    type: string
                message:
                    type: string
                model:
                    type: string
                status:
                    $ref: '#/components/schemas/JobStatus'
            type: object
        CreditBalance:
            properties:
                extra_credits:
                    description: Purchased credits that don't reset monthly.
                    type: integer
                monthly_limit:
                    type: integer
                monthly_remaining:
                    type: integer
                monthly_used:
                    type: integer
                total_available:
                    description: Total spendable credits (monthly remaining + extra).
                    type: integer
            type: object
        DepthMapJob:
            allOf:
                - $ref: '#/components/schemas/MotionJob'
                - properties:
                    face_landmarks_url:
                        description: |
                            With `include_face_landmarks`, once `status=succeeded`: a short-lived signed URL to a JSON
                            file (`format: budgetpixel-face-landmarks/1`) with, per frame and per face, 478 `[x, y, z]`
                            landmarks (x and y as fractions of the frame), 52 blendshape scores (names in
                            `blendshape_names`) and a 4x4 head-pose `matrix`. Kept 7 days.
                        format: uri
                        type: string
                    face_mesh:
                        description: Present when the job asked for `face_mesh` or `include_face_landmarks`, once the worker has run.
                        properties:
                            coverage:
                                description: Share of frames with at least one face, 0 to 1. 0 means no face was found, so nothing was drawn.
                                type: number
                            drawn:
                                description: 'Whether the mesh was drawn on the video (`face_mesh: true`).'
                                type: boolean
                            faces:
                                description: One entry per tracked face.
                                items:
                                    properties:
                                        first_frame:
                                            type: integer
                                        frames:
                                            description: Frames this face has a mesh in
                                            including bridged gaps.: null
                                            type: integer
                                        id:
                                            type: integer
                                        interpolated_frames:
                                            description: Frames filled in across a short gap in tracking (up to 0.3 s).
                                            type: integer
                                        last_frame:
                                            type: integer
                                    type: object
                                type: array
                            frames:
                                description: Frames in the output.
                                type: integer
                            frames_with_face:
                                type: integer
                        type: object
                  type: object
        Error:
            properties:
                error:
                    properties:
                        code:
                            description: Stable machine-readable code.
                            example: model_not_available
                            type: string
                        message:
                            type: string
                        type:
                            description: Error category.
                            example: invalid_request_error
                            type: string
                    required:
                        - type
                        - code
                        - message
                    type: object
            required:
                - error
            type: object
        ImageJob:
            properties:
                completed_at:
                    description: When the job finished. Present once `status` is `succeeded`, `failed` or `timeout`.
                    format: date-time
                    type: string
                created_at:
                    description: When the job was submitted.
                    format: date-time
                    type: string
                error:
                    type: string
                expired:
                    description: Present once `status=succeeded`. `true` after `expires_at`; no URLs are returned then.
                    type: boolean
                expires_at:
                    description: Present once `status=succeeded`. When the outputs are deleted, 24 hours after `created_at`.
                    format: date-time
                    type: string
                id:
                    example: img_a1b2c3d4e5f6
                    type: string
                images:
                    description: |
                        Generated images as signed URLs, each valid for at least 6 hours (call
                        this endpoint again for fresh ones). Present once `status=succeeded`;
                        empty once `expired` is `true`.
                    items:
                        $ref: '#/components/schemas/ImageOutput'
                    type: array
                model:
                    type: string
                prompt:
                    description: The prompt exactly as you submitted it.
                    type: string
                started_at:
                    description: |
                        When processing started, i.e. when the job left the queue
                        (`started_at` minus `created_at` is the queue time). If the job was
                        retried, the start of the latest attempt.
                    format: date-time
                    type: string
                status:
                    $ref: '#/components/schemas/JobStatus'
            type: object
        ImageOutput:
            description: A generated image as a short-lived presigned URL.
            properties:
                position:
                    type: integer
                url:
                    format: uri
                    type: string
            type: object
        JobStatus:
            description: Lifecycle state. `succeeded`/`failed`/`timeout` are terminal.
            enum:
                - pending
                - starting
                - processing
                - completing
                - succeeded
                - failed
                - timeout
            type: string
        LipSyncJob:
            properties:
                completed_at:
                    format: date-time
                    type: string
                created_at:
                    format: date-time
                    type: string
                error_message:
                    type: string
                id:
                    type: string
                model:
                    type: string
                status:
                    description: Lifecycle state. `succeeded`/`failed`/`canceled` are terminal.
                    enum:
                        - pending
                        - processing
                        - succeeded
                        - failed
                        - canceled
                    type: string
                video_codec:
                    description: Codec of the MP4 at `video_url`; present once `status=succeeded`. Lip-sync outputs are `h264`.
                    enum:
                        - h264
                        - h265
                    type: string
                video_url:
                    description: Short-lived presigned URL; present once `status=succeeded`.
                    format: uri
                    type: string
            type: object
        Model:
            properties:
                credits_per_generation:
                    description: Per-output-image cost (images) or per-track cost (music). For image models priced by output size this is the default size's rate — see resolution_pricing. 0 for per-second models (video, sound effects) — see credits_per_unit.
                    example: 45
                    type: integer
                credits_per_unit:
                    description: Per-unit cost for metered models (e.g. per second of video). For resolution-priced models this is the default resolution's rate.
                    example: 220
                    type: integer
                min_billable_seconds:
                    description: Billing floor for per-second audio models (sound effects, Sonilo Music) — cost = credits_per_unit × max(min_billable_seconds, seconds rounded up). Absent for flat-priced models.
                    example: 3
                    type: integer
                name:
                    example: flux-2-klein
                    type: string
                option_pricing:
                    additionalProperties:
                        type: integer
                    description: For image models with paid on/off options, a map of the option's parameter name to the credits it adds per image when enabled (e.g. nano-banana-2.1 `google_search` 10, `image_search` 20). Each amount is the option on its own; the parameter's description says when two options cost less together. Absent when the model has no paid options.
                    example:
                        google_search: 10
                        image_search: 20
                    type: object
                resolution_codecs:
                    additionalProperties:
                        enum:
                            - h264
                            - h265
                        type: string
                    description: For video models where some resolution delivers H.265 (HEVC) instead of H.264, a map of resolution to the output codec (`h264` or `h265`). Absent when every resolution delivers H.264. H.265 outputs are 10-bit and do not play in every browser — see `video_codec` on the job status.
                    example:
                        480p: h264
                        720p: h264
                        1080p: h265
                    type: object
                resolution_pricing:
                    additionalProperties:
                        type: integer
                    description: For models whose rate varies by resolution or output size, a map of resolution to cost — per second for video models, per image for image models (keys are the model's `size` / `resolution` values, e.g. flux-3-image 768px / 1K / 1.5K / 2K / 4K). Absent when pricing is flat.
                    example:
                        4k: 1250
                        480p: 100
                        720p: 220
                        1080p: 550
                    type: object
                size_pricing:
                    additionalProperties:
                        type: integer
                    description: For models sold in sizes (the depth map's small / base / large), a map of size to its credits per unit (per second of input video for `video-depth`). Absent for every other model.
                    example:
                        base: 30
                        large: 40
                        small: 20
                    type: object
                type:
                    enum:
                        - image
                        - video
                        - audio
                    type: string
                unit_type:
                    description: The unit `credits_per_unit` applies to.
                    enum:
                        - generation
                        - second
                    type: string
            required:
                - name
                - type
                - credits_per_generation
            type: object
        Model3DJob:
            properties:
                created_at:
                    format: date-time
                    type: string
                credits:
                    type: integer
                error:
                    type: string
                files:
                    additionalProperties:
                        format: uri
                        type: string
                    description: Every format produced, by kind — `glb` always; Meshy also `fbx`, `usdz`, `stl`, and with rigging `rigged_glb`, `rigged_fbx`, `animation_glb`, `animation_fbx`.
                    type: object
                id:
                    type: string
                model:
                    type: string
                model_url:
                    description: The full 3D model as GLB (signed URL, valid several hours); present once `status=succeeded`.
                    format: uri
                    type: string
                preview_model_url:
                    description: A light copy of the GLB for web viewers (simplified, meshopt-compressed, WebP textures).
                    format: uri
                    type: string
                status:
                    $ref: '#/components/schemas/JobStatus'
                thumbnail_url:
                    description: A rendered picture of the model.
                    format: uri
                    type: string
            type: object
        ModerationBlocked:
            description: Returned (with HTTP 400) when the input content moderation gate blocks a generation request. The block is a property of the request's prompt or input media — reword the prompt or change the input and retry. Branch on `restriction_reason`, which is stable and machine-readable.
            properties:
                error:
                    description: Human-readable explanation of the block.
                    type: string
                restriction_reason:
                    description: Stable machine-readable block reason.
                    enum:
                        - input_csam
                        - input_explicit_adult
                        - input_upload_nudity
                        - input_celebrity_likeness
                        - strict_model_nsfw
                    type: string
            required:
                - error
                - restriction_reason
            type: object
        MotionJob:
            properties:
                completed_at:
                    format: date-time
                    type: string
                created_at:
                    format: date-time
                    type: string
                error_message:
                    type: string
                id:
                    type: string
                model:
                    type: string
                status:
                    description: Lifecycle state. `succeeded`/`failed`/`canceled` are terminal.
                    enum:
                        - pending
                        - processing
                        - succeeded
                        - failed
                        - canceled
                    type: string
                video_codec:
                    description: Codec of the MP4 at `video_url`; present once `status=succeeded`. Video upscales are `h265` (HEVC, 10-bit); motion-control outputs are `h264`.
                    enum:
                        - h264
                        - h265
                    type: string
                video_codec_note:
                    description: Present only when `video_codec` is `h265` — a short explanation of where H.265 plays and what to do when it does not.
                    type: string
                video_url:
                    description: Short-lived presigned URL; present once `status=succeeded`.
                    format: uri
                    type: string
            type: object
        QueueFull:
            description: |
                `429` body when your account already has as many jobs of this kind
                (image, video or audio) in flight as its concurrency cap allows. Submit
                the next job when one of your running jobs finishes.
            properties:
                active_jobs:
                    description: Jobs of this kind in flight right now.
                    type: integer
                code:
                    enum:
                        - queue_full
                    type: string
                error:
                    description: Human-readable message.
                    type: string
                queue_full:
                    enum:
                        - true
                    type: boolean
                queue_limit:
                    description: Your concurrency cap for this kind of job.
                    type: integer
                retry_after_seconds:
                    description: Same value as the `Retry-After` header.
                    type: integer
            required:
                - error
                - code
                - queue_full
                - queue_limit
                - active_jobs
                - retry_after_seconds
            type: object
        StockAudio:
            description: One sound effect or music track from the free audio library.
            properties:
                ai_generated:
                    example: true
                    type: boolean
                attribution:
                    description: The credit line the licence requires wherever the audio is used.
                    properties:
                        html:
                            description: The same credit as HTML links, for web pages.
                            type: string
                        required:
                            example: true
                            type: boolean
                        text:
                            example: “Heavy Rain Thunder” by BudgetPixel AI (https://budgetpixel.com/sfx/heavy-rain-thunder-3d04cdea) — CC BY 4.0
                            type: string
                    type: object
                category:
                    description: A sound effect's category; `music` for every track.
                    type: string
                channels:
                    example: 2
                    type: integer
                created_at:
                    format: date-time
                    type: string
                downloads:
                    type: integer
                duration_seconds:
                    example: 6.037
                    type: number
                format:
                    description: The file format of `urls.original`.
                    enum:
                        - wav
                        - mp3
                    type: string
                id:
                    format: uuid
                    type: string
                keywords:
                    description: Everyday phrases people search it by.
                    items:
                        type: string
                    type: array
                license:
                    properties:
                        code:
                            example: CC-BY-4.0
                            type: string
                        name:
                            example: CC BY 4.0
                            type: string
                        url:
                            example: https://creativecommons.org/licenses/by/4.0/
                            type: string
                    type: object
                model:
                    description: The model that generated the audio.
                    type: string
                page_url:
                    description: The item's page on budgetpixel.com — the link its credit line points to.
                    example: https://budgetpixel.com/sfx/heavy-rain-thunder-3d04cdea
                    type: string
                prompt:
                    description: The prompt the audio was generated from.
                    type: string
                quality_score:
                    description: Review score out of 10.
                    type:
                        - number
                        - "null"
                sample_rate:
                    example: 44100
                    type: integer
                size_bytes:
                    type: integer
                tags:
                    description: How it sounds.
                    items:
                        type: string
                    type: array
                title:
                    example: Heavy Rain Thunder
                    type: string
                type:
                    enum:
                        - sound_effect
                        - music
                    type: string
                urls:
                    properties:
                        cover:
                            description: Square cover art, when the item has one.
                            type: string
                        original:
                            description: The audio file.
                            type: string
                    type: object
            type: object
        StockAudioList:
            properties:
                credits_charged:
                    example: 10
                    type: integer
                data:
                    items:
                        $ref: '#/components/schemas/StockAudio'
                    type: array
                has_more:
                    description: More results exist past this page.
                    type: boolean
                limit:
                    type: integer
                object:
                    enum:
                        - list
                    type: string
                offset:
                    type: integer
                total:
                    description: Total matching items.
                    type: integer
            required:
                - object
                - data
                - total
                - limit
                - offset
                - has_more
                - credits_charged
            type: object
        StockImage:
            properties:
                ai_generated:
                    example: true
                    type: boolean
                alt_text:
                    description: One-sentence description for screen readers.
                    type: string
                attribution:
                    description: The credit line the licence requires wherever the image is used.
                    properties:
                        html:
                            description: The same credit as HTML links, for web pages.
                            type: string
                        required:
                            example: true
                            type: boolean
                        text:
                            example: “Mountain Goat On Rocky Ledge” by BudgetPixel AI (https://budgetpixel.com/images/mountain-goat-on-rocky-ledge-33643c7a) — CC BY 4.0
                            type: string
                    type: object
                category:
                    type: string
                colors:
                    description: Dominant colours.
                    items:
                        type: string
                    type: array
                created_at:
                    format: date-time
                    type: string
                description:
                    type: string
                downloads:
                    type: integer
                height:
                    description: Original height in pixels.
                    type: integer
                id:
                    format: uuid
                    type: string
                license:
                    properties:
                        code:
                            example: CC-BY-4.0
                            type: string
                        name:
                            example: CC BY 4.0
                            type: string
                        url:
                            example: https://creativecommons.org/licenses/by/4.0/
                            type: string
                    type: object
                model:
                    description: The model that generated the image.
                    type: string
                orientation:
                    enum:
                        - landscape
                        - portrait
                        - square
                    type: string
                page_url:
                    description: The image's page on budgetpixel.com — the link its credit line points to.
                    example: https://budgetpixel.com/images/mountain-goat-on-rocky-ledge-33643c7a
                    type: string
                prompt:
                    description: The prompt the image was generated from.
                    type: string
                quality_score:
                    description: Review score out of 10.
                    type:
                        - number
                        - "null"
                style:
                    enum:
                        - photo
                        - illustration
                        - 3d
                        - painting
                        - vector
                    type: string
                tags:
                    items:
                        type: string
                    type: array
