                    type: boolean
                limit:
                    type: integer
                object:
                    enum:
                        - list
                    type: string
                offset:
                    type: integer
                total:
                    description: Total matching images.
                    type: integer
            required:
                - object
                - data
                - total
                - limit
                - offset
                - has_more
                - credits_charged
            type: object
        Theme:
            description: A live clan theme you can enter with `POST /v1/posts` `theme_id`.
            properties:
                clan:
                    description: The clan hosting the theme.
                    properties:
                        id:
                            type: integer
                        name:
                            example: Neon Collective
                            type: string
                        role:
                            description: Your role in this clan.
                            enum:
                                - owner
                                - moderator
                                - member
                            type: string
                        slug:
                            example: neon-collective
                            type: string
                        url:
                            example: https://budgetpixel.com/clans/neon-collective
                            format: uri
                            type: string
                    type: object
                description:
                    description: The theme's brief from its host.
                    type: string
                ends_at:
                    description: Entries close at this time.
                    format: date-time
                    type: string
                entry_count:
                    description: Posts entered so far.
                    type: integer
                id:
                    description: Pass this as `theme_id` on `POST /v1/posts`.
                    example: 75
                    type: integer
                participant_count:
                    description: Distinct creators who have entered.
                    type: integer
                starts_at:
                    format: date-time
                    type: string
                title:
                    example: Neon Noir
                    type: string
                url:
                    description: Public page listing the theme's entries.
                    example: https://budgetpixel.com/themes/75
                    format: uri
                    type: string
            type: object
        UploadResponse:
            description: A stored, ephemeral input file. Pass `url` as a media parameter on a generation request.
            properties:
                bytes:
                    description: Stored file size in bytes.
                    type: integer
                content_type:
                    example: image/png
                    type: string
                expires_in:
                    description: Seconds the file is retained (~86400).
                    type: integer
                url:
                    description: Short-lived URL to use as a media input (valid ~24h).
                    format: uri
                    type: string
            type: object
        UpscaleJob:
            properties:
                completed_at:
                    format: date-time
                    type: string
                created_at:
                    format: date-time
                    type: string
                error_message:
                    type: string
                id:
                    type: string
                image_url:
                    description: Short-lived presigned URL of the upscaled image; present once `status=succeeded`.
                    format: uri
                    type: string
                model:
                    type: string
                status:
                    description: Lifecycle state. `succeeded`/`failed`/`canceled` are terminal.
                    enum:
                        - pending
                        - processing
                        - succeeded
                        - failed
                        - canceled
                    type: string
            type: object
        VideoJob:
            properties:
                aspect_ratio:
                    type: string
                completed_at:
                    format: date-time
                    type: string
                created_at:
                    format: date-time
                    type: string
                error_message:
                    type: string
                expired:
                    description: Present once `status=succeeded`. `true` after `expires_at`; `video_url` is not returned then.
                    type: boolean
                expires_at:
                    description: Present once `status=succeeded`. When the output is deleted, 24 hours after `created_at`.
                    format: date-time
                    type: string
                id:
                    description: The job id (the same value `POST /v1/videos/{model}` returned).
                    type: string
                job_id:
                    deprecated: true
                    description: Same as `id`; kept for older clients.
                    type: string
                length_seconds:
                    type: integer
                model:
                    type: string
                prompt:
                    description: The prompt exactly as you submitted it.
                    type: string
                resolution:
                    description: The resolution the job ran at.
                    type: string
                started_at:
                    format: date-time
                    type: string
                status:
                    $ref: '#/components/schemas/JobStatus'
                updated_at:
                    format: date-time
                    type: string
                video_codec:
                    description: Codec of the MP4 at `video_url`; present once `status=succeeded`. Most models and resolutions deliver `h264`. A few high-definition tiers deliver `h265` (HEVC, 10-bit) — see `resolution_codecs` in GET /v1/models.
                    enum:
                        - h264
                        - h265
                    type: string
                video_codec_note:
                    description: Present only when `video_codec` is `h265` — a short explanation of where H.265 plays and what to do when it does not.
                    type: string
                video_url:
                    description: Signed URL, valid at least 6 hours (call this endpoint again for a fresh one); present once `status=succeeded`, until `expired` is `true`.
                    format: uri
                    type: string
            type: object
    securitySchemes:
        ApiKeyAuth:
            bearerFormat: bpx_live_*
            description: 'API key as a bearer token: Authorization: Bearer bpx_live_xxx'
            scheme: bearer
            type: http
info:
    contact:
        email: support@budgetpixel.com
        name: BudgetPixel Support
    description: |
        The BudgetPixel developer API for programmatic image, video, music and
        sound-effect generation.

        Generation is **asynchronous**: you create a job, then poll its status until it
        reaches a terminal state (`succeeded` / `failed`). You are charged in credits
        only on success — never for failures, timeouts, or content blocked before
        generation.

        **Authentication.** All requests require an API key sent as a bearer token:

            Authorization: Bearer bpx_live_xxx

        Create and manage keys from your BudgetPixel account dashboard. The developer
        API is available on **every paid plan**. On the **Free** plan, API keys can call
        the free library searches only: `GET /v1/stock/images`,
        `GET /v1/stock/sound-effects` and `GET /v1/stock/music`.

        **Pricing.** API usage is metered in credits at each model's published price
        (see `GET /v1/models`), and your plan's model discounts and active promotions
        apply to API charges exactly as they do on the web — `POST /v1/cost` quotes
        your discounted price. Pro and Ultra plans include a daily free-models
        allowance (a shared pool of free generations per day across qualified image
        models such as FLUX 2 Klein and Qwen-Image) that covers API
        requests too — the standard price applies once the day's pool is used.
        Other promotional free daily generations remain web/app-only. Failed
        generations are never charged.

        **Rate limits.** Requests are limited per minute: **600 requests/min per API
        key** and **1200 requests/min per source IP** (defaults; subject to tuning).
        Every response carries `X-RateLimit-Limit`, `X-RateLimit-Remaining`, and
        `X-RateLimit-Reset` (seconds until the window resets). Exceeding a limit
        returns HTTP `429` with a `Retry-After` header — wait that long before
        retrying. Rejected requests still count against the window, so a tight retry
        loop keeps you limited; back off instead. Generation jobs additionally have a
        per-plan concurrency cap (the same one as the web workshop), independent of
        these request limits. `POST /v1/uploads` also has a dedicated **60 uploads/min
        per account** cap (it's free/unmetered) on top of these limits. Every `429`
        this API returns carries `Retry-After`, including a full concurrency queue
        (a suggested wait) and the monthly spend limit (seconds until the month
        resets).

        **Output retention.** Generated files are kept for 24 hours after the job is
        created. Job status responses give the exact time as `expires_at`; after it,
        `expired` is `true` and no download URLs are returned.
    title: BudgetPixel API
    version: "2026-06-20"
openapi: 3.1.0
paths:
    /3d/{job_id}:
        get:
            description: |
                Poll every 15-30 seconds until `status` is `succeeded` (usually 2-5 minutes).
                The model is returned as short-lived signed URLs (valid for several hours;
                re-call this endpoint for fresh URLs anytime — the underlying files are
                deleted about 24h after generation). `model_url` is the full GLB; `files`
                lists every format the model produced; `preview_model_url` is a light,
                compressed GLB (EXT_meshopt_compression, WebP textures) for showing the
                model in a web viewer.
            operationId: get3DModel
            parameters:
                - description: The job id returned by the create endpoint.
                  in: path
                  name: job_id
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Model3DJob'
                    description: Current job status. The file URLs are populated once succeeded.
                "401":
                    $ref: '#/components/responses/Unauthorized'
                "403":
                    $ref: '#/components/responses/Forbidden'
                "404":
                    $ref: '#/components/responses/NotFound'
            summary: Get 3D model job status
            tags:
                - 3D Models
    /3d/meshy-7.1:
        post:
            description: |-
                Image to 3D: a light textured model (~30K triangles) in GLB, FBX, USDZ and STL, optionally rigged and animated for humanoid characters. About 2 minutes. 1600 credits textured.

                **Asynchronous.** Returns a job `id` (the model is not in this response). Poll [`GET /v1/3d/{id}`](/api-reference/3d-models/get-3d-model-job-status) every 15-30 seconds until `status` is `succeeded` (usually 2-5 minutes) — the GLB is that response's `model_url` and every format is in `files`. Charged on success only; `POST /v1/cost` quotes the exact price for your options.

                Examples, sample output and pricing: [Meshy 7.1](https://budgetpixel.com/models/meshy-7.1)
            operationId: create3DModel_meshy_7_1
            requestBody:
                content:
                    application/json:
                        schema:
                            properties:
                                animation:
                                    default: false
                                    description: Also return an animated model (+160 credits). Needs rigging.
                                    type: boolean
                                image:
                                    description: 'The picture to turn into a 3D model: a public URL, a data URI, raw base64, or a URL from POST /v1/uploads.'
                                    type: string
                                    x-bpx-media: image
                                rigging:
                                    default: false
                                    description: Rig a humanoid character with walk and run clips (+270 credits). Humanoid characters only.
                                    type: boolean
                                texture:
                                    default: true
                                    description: Paint the model (true) or return the plain shape (false, 1080 credits).
                                    type: boolean
                            required:
                                - image
                            type: object
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/CreateModel3DResponse'
                    description: Job accepted.
                "400":
                    $ref: '#/components/responses/BadRequest'
                "401":
                    $ref: '#/components/responses/Unauthorized'
                "403":
                    $ref: '#/components/responses/Forbidden'
                "429":
                    $ref: '#/components/responses/TooManyRequests'
            summary: Generate a 3D model with Meshy 7.1
            tags:
                - 3D Models
    /3d/tripo-h3.1:
        post:
            description: |-
                Image to 3D: a textured GLB with PBR materials (base color, normal, roughness, metalness). Most faithful to the picture, including flat cartoons. About 4 minutes. 400 credits textured.

                **Asynchronous.** Returns a job `id` (the model is not in this response). Poll [`GET /v1/3d/{id}`](/api-reference/3d-models/get-3d-model-job-status) every 15-30 seconds until `status` is `succeeded` (usually 2-5 minutes) — the GLB is that response's `model_url` and every format is in `files`. Charged on success only; `POST /v1/cost` quotes the exact price for your options.

                Examples, sample output and pricing: [Tripo H3.1](https://budgetpixel.com/models/tripo-h3.1)
            operationId: create3DModel_tripo_h3_1
            requestBody:
                content:
                    application/json:
                        schema:
                            properties:
                                detailed_geometry:
                                    default: false
                                    description: Finer shape detail (+270 credits).
                                    type: boolean
                                image:
                                    description: 'The picture to turn into a 3D model: a public URL, a data URI, raw base64, or a URL from POST /v1/uploads. One subject on a plain or transparent background works best.'
                                    type: string
                                    x-bpx-media: image
                                texture:
                                    default: true
                                    description: Paint the model (true) or return the plain shape (false, 270 credits).
                                    type: boolean
                                texture_quality:
                                    default: standard
                                    description: 'detailed: higher-resolution textures (540 credits instead of 400).'
                                    enum:
                                        - standard
                                        - detailed
                                    type: string
                            required:
                                - image
                            type: object
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/CreateModel3DResponse'
                    description: Job accepted.
                "400":
                    $ref: '#/components/responses/BadRequest'
                "401":
                    $ref: '#/components/responses/Unauthorized'
                "403":
                    $ref: '#/components/responses/Forbidden'
                "429":
                    $ref: '#/components/responses/TooManyRequests'
            summary: Generate a 3D model with Tripo H3.1
            tags:
                - 3D Models
    /account/credits:
        get:
            operationId: getCredits
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/CreditBalance'
                    description: Current credit balance for the account.
                "401":
                    $ref: '#/components/responses/Unauthorized'
            summary: Get credit balance
            tags:
                - Account
    /audios/{job_id}:
        get:
            description: |
                Poll until `status` is `succeeded`. The generated track (or sound effect) is
                returned as a signed `audio_url`, valid for at least 6 hours; call this
                endpoint again for a fresh one at any time until `expires_at`, 24 hours after
                the job was created. After that the file is deleted, `expired` is `true` and
                no URL is returned. Serves every `POST /v1/audios/{model}` job — music and
                sound effects alike.
            operationId: getAudio
            parameters:
                - description: The opaque job id returned by the create endpoint (e.g. `aud_...`).
                  in: path
                  name: job_id
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/AudioJob'
                    description: Current job status. `audio_url` is populated once succeeded.
                "401":
                    $ref: '#/components/responses/Unauthorized'
                "403":
                    $ref: '#/components/responses/Forbidden'
                "404":
                    $ref: '#/components/responses/NotFound'
            summary: Get music job status
            tags:
                - Audios
    /audios/lyria-3:
        post:
            description: |-
                Google Lyria 3 — high-fidelity music from a text prompt, with optional lyrics and up to 10 reference images to condition the mood. MP3 output (SynthID-watermarked).

                **Asynchronous.** Returns a job `id` (the track is not in this response). Poll [`GET /v1/audios/{id}`](/api-reference/audios/get-music-job-status) until `status` is `succeeded` — the track URL is in that response's `audio_url`.

                Examples, sample output and pricing: [Lyria 3](https://budgetpixel.com/models/lyria-3)
            operationId: createAudio_lyria_3
            requestBody:
                content:
                    application/json:
                        schema:
                            properties:
                                images:
                                    description: Optional reference images (up to 10) to condition the track's mood/theme. Each item is a public image URL, a data URI, raw base64, or an uploaded-file URL from POST /v1/uploads.
                                    items:
                                        type: string
                                    maxItems: 10
                                    type: array
                                    x-bpx-media: image
                                lyrics:
                                    description: Optional lyrics (up to 3000 characters).
                                    type: string
                                prompt:
                                    description: Description of the music to generate (10-2000 characters).
                                    type: string
                            required:
                                - prompt
                            type: object
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/CreateAudioResponse'
                    description: Job accepted.
                "400":
                    $ref: '#/components/responses/BadRequest'
                "401":
                    $ref: '#/components/responses/Unauthorized'
                "403":
                    $ref: '#/components/responses/Forbidden'
                "429":
                    $ref: '#/components/responses/TooManyRequests'
            summary: Generate music with Lyria 3
            tags:
                - Music
    /audios/mureka-v9:
        post:
            description: |-
                Mureka V9 — songs that sing your exact lyrics (structural tags like [verse]/[chorus] supported) with a vocal gender preference, or instrumental/BGM tracks from a prompt. MP3 output.

                **Asynchronous.** Returns a job `id` (the track is not in this response). Poll [`GET /v1/audios/{id}`](/api-reference/audios/get-music-job-status) until `status` is `succeeded` — the track URL is in that response's `audio_url`.

                Examples, sample output and pricing: [Mureka V9](https://budgetpixel.com/models/mureka-v9)
            operationId: createAudio_mureka_v9
            requestBody:
                content:
                    application/json:
                        schema:
                            properties:
                                instrumental:
                                    default: false
                                    description: Generate an instrumental/BGM track from the prompt (no vocals, lyrics ignored).
                                    type: boolean
                                lyrics:
                                    description: Lyrics to sing verbatim (1-5000 characters; [verse]/[chorus]/[bridge] tags supported). Required for songs; ignored for instrumental tracks.
                                    type: string
                                prompt:
                                    description: Style hint (up to 1024 characters). Optional for songs; required for instrumental tracks.
                                    type: string
                                vocal_gender:
                                    default: auto
                                    description: Preferred vocal gender for songs.
                                    enum:
                                        - auto
                                        - female
                                        - male
                                    type: string
                            type: object
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/CreateAudioResponse'
                    description: Job accepted.
                "400":
                    $ref: '#/components/responses/BadRequest'
                "401":
                    $ref: '#/components/responses/Unauthorized'
                "403":
                    $ref: '#/components/responses/Forbidden'
                "429":
                    $ref: '#/components/responses/TooManyRequests'
            summary: Generate music with Mureka V9
            tags:
                - Music
    /audios/music-2.6:
        post:
            description: |-
                MiniMax Music 2.6 — full-length songs from a style prompt and/or your own lyrics. Lyrics optimizer can write or polish lyrics from the prompt; instrumental mode skips vocals. MP3 or WAV output.

                **Asynchronous.** Returns a job `id` (the track is not in this response). Poll [`GET /v1/audios/{id}`](/api-reference/audios/get-music-job-status) until `status` is `succeeded` — the track URL is in that response's `audio_url`.

                Examples, sample output and pricing: [Music 2.6](https://budgetpixel.com/models/music-2.6)
            operationId: createAudio_music_2_6
            requestBody:
                content:
                    application/json:
                        schema:
                            properties:
                                format:
                                    default: wav
                                    description: Output audio format. Defaults to wav (lossless); choose mp3 for a smaller file.
                                    enum:
                                        - wav
                                        - mp3
                                    type: string
                                instrumental:
                                    default: false
                                    description: Generate an instrumental track (no vocals).
                                    type: boolean
                                lyrics:
                                    description: Lyrics to sing (1-3500 characters). Required unless instrumental is true or lyrics_optimizer is true (the optimizer writes lyrics from the prompt).
                                    type: string
                                lyrics_optimizer:
                                    default: true
                                    description: Let the model write or polish lyrics from the prompt. Default true.
                                    type: boolean
                                prompt:
                                    description: Style/mood description of the track (up to 2000 characters). Optional when lyrics are provided.
                                    type: string
                            type: object
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/CreateAudioResponse'
                    description: Job accepted.
                "400":
                    $ref: '#/components/responses/BadRequest'
                "401":
                    $ref: '#/components/responses/Unauthorized'
                "403":
                    $ref: '#/components/responses/Forbidden'
                "429":
                    $ref: '#/components/responses/TooManyRequests'
            summary: Generate music with Music 2.6
            tags:
                - Music
    /audios/music-3.0:
        post:
            description: |-
                MiniMax Music 3.0 — the latest MiniMax music model: full-length songs from a style prompt and/or your own lyrics. Lyrics optimizer can write or polish lyrics from the prompt; instrumental mode skips vocals. WAV or MP3 output.

                **Asynchronous.** Returns a job `id` (the track is not in this response). Poll [`GET /v1/audios/{id}`](/api-reference/audios/get-music-job-status) until `status` is `succeeded` — the track URL is in that response's `audio_url`.

                Examples, sample output and pricing: [Music 3.0](https://budgetpixel.com/models/music-3.0)
            operationId: createAudio_music_3_0
            requestBody:
                content:
                    application/json:
                        schema:
                            properties:
                                format:
                                    default: wav
                                    description: Output audio format. Defaults to wav (lossless); choose mp3 for a smaller file.
                                    enum:
                                        - wav
                                        - mp3
                                    type: string
                                instrumental:
                                    default: false
                                    description: Generate an instrumental track (no vocals).
                                    type: boolean
                                lyrics:
                                    description: Lyrics to sing (1-3500 characters). Required unless instrumental is true or lyrics_optimizer is true (the optimizer writes lyrics from the prompt).
                                    type: string
                                lyrics_optimizer:
                                    default: true
                                    description: Let the model write or polish lyrics from the prompt. Default true.
                                    type: boolean
                                prompt:
                                    description: Style/mood description of the track (up to 2000 characters). Optional when lyrics are provided.
                                    type: string
                            type: object
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/CreateAudioResponse'
                    description: Job accepted.
                "400":
                    $ref: '#/components/responses/BadRequest'
                "401":
                    $ref: '#/components/responses/Unauthorized'
                "403":
                    $ref: '#/components/responses/Forbidden'
                "429":
                    $ref: '#/components/responses/TooManyRequests'
            summary: Generate music with Music 3.0
            tags:
                - Music
    /audios/sonilo-music:
        post:
            description: |-
                Sonilo text-to-music — licensed instrumental and background music of an exact length (5-360 seconds) from a text prompt: soundtracks for videos, ads, apps and games. Priced per second of the requested duration with a 10-second minimum (rate in GET /v1/models; POST /v1/cost quotes the exact price). MP3 or WAV output.

                **Asynchronous.** Returns a job `id` (the track is not in this response). Poll [`GET /v1/audios/{id}`](/api-reference/audios/get-music-job-status) until `status` is `succeeded` — the track URL is in that response's `audio_url`. Charged per second of the requested `duration` (10-second minimum; rate in `GET /v1/models`) on success only; `POST /v1/cost` quotes the exact price.

                Examples, sample output and pricing: [Sonilo Music](https://budgetpixel.com/models/sonilo-music)
            operationId: createAudio_sonilo_music
            requestBody:
                content:
                    application/json:
                        schema:
                            properties:
                                duration:
                                    default: 30
                                    description: Length of the track in seconds (5-360). Billed per second with a 10-second minimum.
                                    maximum: 360
                                    minimum: 5
                                    type: integer
                                format:
                                    default: mp3
                                    description: Output audio format.
                                    enum:
                                        - mp3
                                        - wav
                                    type: string
                                prompt:
                                    description: Description of the music (up to 2000 characters; even a few words work), e.g. "30 seconds of upbeat electronic instrumental for a product launch video, no vocals".
                                    type: string
                            required:
                                - prompt
                            type: object
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/CreateAudioResponse'
                    description: Job accepted.
                "400":
                    $ref: '#/components/responses/BadRequest'
                "401":
                    $ref: '#/components/responses/Unauthorized'
                "403":
                    $ref: '#/components/responses/Forbidden'
                "429":
                    $ref: '#/components/responses/TooManyRequests'
