            description: |
                Search BudgetPixel's free background music library (the tracks at
                [budgetpixel.com/background-music](https://budgetpixel.com/background-music)):
                AI-generated instrumental beds for videos, podcasts, streams and apps — lofi,
                corporate, cinematic, acoustic, electronic and more, each listened to and scored
