                `theme_id`. A theme is a time-boxed creative event hosted by a clan
                (`budgetpixel.com/themes/<id>`); entered posts appear on the theme's page.

                Includes every live theme of the clans you **own, moderate, or have joined**,
                with your `role` in each clan. Themes of clans you're banned from, or whose owner
                you have a block with, are left out. Themes that haven't started or have ended
                are left out too, since they don't accept entries.

                Ordered by deadline, soonest first (`ends_at`). Returns at most 100 themes.
                **Free** — no credits are charged.
            operationId: listThemes
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                properties:
                                    themes:
                                        items:
                                            $ref: '#/components/schemas/Theme'
                                        type: array
                                type: object
                    description: The themes you can post to (an empty list when you aren't in any clan with a live theme).
                "401":
                    $ref: '#/components/responses/Unauthorized'
                "403":
                    $ref: '#/components/responses/Forbidden'
                "429":
                    $ref: '#/components/responses/TooManyRequests'
            summary: List themes you can post to
            tags:
                - Social
    /uploads:
        post:
            description: |
                Upload an image, video, or audio file to use as input for a generation (e.g. the
                `image` param on an image-to-image or image-to-video request). Returns a
                short-lived `url` you pass as that media parameter.

                Files are ephemeral — stored privately and deleted ~24h after upload. Max 50 MB.

                You don't have to upload first: any media param also accepts a public image URL, a
                data URI, or raw base64 directly. Uploading is the convenient path when you have a
                local file and no public URL to point at.

                **Rate limit.** This endpoint is free (not metered), so it carries a dedicated cap
                of **60 uploads/min per account** (a rolling window), on top of the global per-key
                and per-IP request limits. Exceeding it returns `429` with a `Retry-After` header.
            operationId: uploadMedia
            requestBody:
                content:
                    multipart/form-data:
                        schema:
                            properties:
                                file:
                                    description: The media file. Image (PNG/JPEG/WebP/GIF), video (MP4/WebM), or audio (MP3/WAV/OGG).
                                    format: binary
                                    type: string
                            required:
                                - file
                            type: object
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/UploadResponse'
                    description: Stored. Pass `url` as a media param on a generation request.
                "400":
                    $ref: '#/components/responses/BadRequest'
                "401":
                    $ref: '#/components/responses/Unauthorized'
                "403":
                    $ref: '#/components/responses/Forbidden'
                "413":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: File exceeds the size limit.
                "415":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: Unsupported file type.
                "429":
                    $ref: '#/components/responses/TooManyRequests'
            summary: Upload input media
            tags:
                - Uploads
