            tags:
                - Upscaling
    /video-upscales/flux-3-video-upscale:
        post:
            description: |-
                Black Forest Labs' FLUX 3 super-resolution for video: 1.5x to 3x the input frame (the aspect ratio is kept; an output frame is capped at about 14 MP), at the input's frame rate, with its audio kept. Output is H.264 MP4. precise mode keeps the source as it is (faces, products); creative mode adds fine detail. Priced per megapixel-second of OUTPUT (1 MP = 1,048,576 pixels): 95 credits precise, 135 creative, so one second of 1080p output is 188 / 267 credits and of 4K 752 / 1068. Input up to 20 seconds and 2560x1440, ≤100MB.

                **Asynchronous.** Returns a job `id` (the video is not in this response). Poll [`GET /v1/video-upscales/{id}`](/api-reference/upscaling/get-video-upscale-job-status) until `status` is `succeeded` — the video URL is in that response's `video_url`.

