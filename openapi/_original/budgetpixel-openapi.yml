    /cost:
        post:
            description: |
                Returns the credit cost of a generation request **without running it**. Send the same
                body you'd send to the generate endpoint, plus `model`.

                The cost is computed by the same logic that bills you, so it can't disagree with the
                invoice. `exact` is `true` for deterministic pricing. For seedream's sequential mode
                (the model chooses how many images, up to `max_images`) `credits` is the ceiling we
                reserve and `exact` is `false` — the real charge is always ≤ it. Failed jobs cost
                nothing, so you're never charged more than `credits`.
            operationId: estimateCost
            requestBody:
                content:
                    application/json:
                        example:
                            length_seconds: 5
                            model: seedance-2.0
                            resolution: 1080p
                        schema:
                            additionalProperties: true
                            properties:
                                model:
                                    description: The model slug (image or video), e.g. `seedance-2.0`.
                                    type: string
                            required:
                                - model
                            type: object
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/CostEstimate'
                    description: The estimated cost.
                "400":
                    $ref: '#/components/responses/BadRequest'
                "401":
                    $ref: '#/components/responses/Unauthorized'
                "403":
                    $ref: '#/components/responses/Forbidden'
                "404":
                    $ref: '#/components/responses/NotFound'
                "429":
                    $ref: '#/components/responses/TooManyRequests'
            summary: Estimate the cost of a request
            tags:
                - Models
    /depth-maps/{id}:
        get:
            description: |
                Poll until `status` is `succeeded`. The depth video is returned as a
                short-lived signed `video_url` (valid for several hours; re-call for a fresh
                URL anytime — the underlying object is deleted 24h after generation).

                The depth video is an H.264 MP4 at the input's frame size (up to 1080p,
                or the `resolution` you asked for) and frame rate (up to 30 fps). In
                grayscale, near is white and far is black.

                With `face_mesh` or `include_face_landmarks`, the response adds
                `face_mesh` (how much of the clip had a face, and each face's frames)
                and, with `include_face_landmarks`, a signed `face_landmarks_url`.
            operationId: getDepthMapJob
            parameters:
                - description: The opaque job id returned by the create endpoint.
                  in: path
                  name: id
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/DepthMapJob'
                    description: Current job status. `video_url` is populated once succeeded.
                "401":
                    $ref: '#/components/responses/Unauthorized'
                "403":
                    $ref: '#/components/responses/Forbidden'
                "404":
                    $ref: '#/components/responses/NotFound'
            summary: Get depth map job status
            tags:
                - Depth Maps
    /depth-maps/video-depth-anything:
        post:
            description: |-
                Turns a video into a depth map video: near is white, far is black, steady from frame to frame, at the input's size (up to 1080p) and frame rate (up to 30 fps). Feed it to a video model as a structure or motion reference. Three sizes: small is fastest, base adds edge detail, large draws the finest detail (hair, thin poles, distant people) and is the steadiest. Priced per second of the INPUT video, rounded up, 5 seconds minimum: small 20, base 30, large 40 credits/second (input up to 30 seconds, ≤100MB). Output is H.264 MP4. Optional face mesh, at no extra charge: face_mesh draws each face's mesh (eyes, brows and lips in colour) over the depth so a video model keeps lip, eye and head movement, and include_face_landmarks returns per-frame landmarks, expression scores and head pose as JSON.

                **Asynchronous.** Returns a job `id` (the video is not in this response). Poll [`GET /v1/depth-maps/{id}`](/api-reference/depth-maps/get-depth-map-job-status) until `status` is `succeeded` — the depth video's URL is in that response's `video_url`.

                Examples, sample output and pricing: [Video Depth Anything](https://budgetpixel.com/models/video-depth-anything)
            operationId: createDepthMap_video_depth_anything
            requestBody:
                content:
                    application/json:
                        schema:
                            properties:
                                colormap:
                                    default: grayscale
                                    description: grayscale (near = white) is what video models take as a depth reference; turbo, inferno, magma and viridis colour it for viewing.
                                    enum:
                                        - grayscale
                                        - turbo
                                        - inferno
                                        - magma
                                        - viridis
                                    type: string
                                face_mesh:
                                    default: false
                                    description: Draw a mesh over each face (up to max_faces), with eyes, brows and lips in colour, so a video model given the depth map keeps lip, eye and head movement. Faces are found automatically; a face turned to full profile gets no mesh. No extra charge.
                                    type: boolean
                                include_face_landmarks:
                                    default: false
                                    description: 'Also return face_landmarks_url: a JSON file with 478 3D points, 52 expression (blendshape) scores and a head-pose matrix per face per frame. Works with or without face_mesh. The file is kept 7 days. No extra charge.'
                                    type: boolean
                                keep_audio:
                                    default: false
                                    description: Copy the input's audio into the depth video.
                                    type: boolean
                                max_faces:
                                    default: 4
                                    description: Most faces tracked at once (1-4), largest first. Applies to face_mesh and include_face_landmarks.
                                    maximum: 4
                                    minimum: 1
                                    type: integer
                                resolution:
                                    default: auto
                                    description: The output's short side; auto keeps the input's size up to 1080p. Never upscales. The price is the same at every resolution.
                                    enum:
                                        - auto
                                        - 360p
                                        - 480p
                                        - 720p
                                        - 1080p
                                    type: string
                                side_by_side:
                                    default: false
                                    description: Return the input on the left and the depth map on the right, twice the width.
                                    type: boolean
                                size:
                                    default: small
                                    description: 'Model size, which sets the per-second rate: small 20, base 30, large 40 credits.'
                                    enum:
                                        - small
                                        - base
                                        - large
                                    type: string
                                video:
                                    description: The video to turn into a depth map (up to 30 seconds, MP4/MOV/WebM, ≤100MB). A public video URL or an uploaded-file URL from POST /v1/uploads (videos are passed by URL, not inlined).
                                    type: string
                                    x-bpx-media: video
                            required:
                                - video
                            type: object
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/CreateDepthMapResponse'
                    description: Job accepted.
                "400":
                    $ref: '#/components/responses/BadRequest'
                "401":
                    $ref: '#/components/responses/Unauthorized'
                "403":
                    $ref: '#/components/responses/Forbidden'
                "429":
                    $ref: '#/components/responses/TooManyRequests'
            summary: Make a depth map with Video Depth Anything
            tags:
                - Depth Maps
    /images/{job_id}:
