    /videos/{job_id}:
        get:
            description: |
                Poll until `status` is `succeeded`. The generated video is returned as a
                signed `video_url`, valid for at least 6 hours; call this endpoint again for a
                fresh one at any time until `expires_at`, 24 hours after the job was created.
                After that the file is deleted, `expired` is `true` and no URL is returned.

                Every output is an MP4, and `video_codec` says which codec is inside. Most
                models and resolutions deliver H.264. A few high-definition tiers deliver
                H.265 (HEVC, 10-bit) exactly as the model produced it — currently SeeDance
