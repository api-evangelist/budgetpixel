                "401":
                    $ref: '#/components/responses/Unauthorized'
                "403":
                    $ref: '#/components/responses/Forbidden'
                "429":
                    $ref: '#/components/responses/TooManyRequests'
            summary: Upscale an image with Clarity Upscaler
            tags:
                - Upscaling
    /upscales/p-image-upscale:
        post:
            description: |-
                Pruna AI P-Image Upscale — fast image upscaling with results in seconds, up to 32 MP output. Priced by the target resolution tier: 4 MP = 10, 8 MP = 15, 16 MP = 30, 32 MP = 60 credits per image.

                **Asynchronous.** Returns a job `id` (the image is not in this response). Poll [`GET /v1/upscales/{id}`](/api-reference/upscaling/get-upscale-job-status) until `status` is `succeeded` — the image URL is in that response's `image_url`.

