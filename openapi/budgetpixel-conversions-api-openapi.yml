openapi: 3.2.0
info:
  contact:
    email: support@budgetpixel.com
    name: BudgetPixel Support
  description: 'The BudgetPixel developer API for programmatic image, video, music and

    sound-effect generation.


    Generation is **asynchronous**: you create a job, then poll its status until it

    reaches a terminal state (`succeeded` / `failed`). You are charged in credits

    only on success — never for failures, timeouts, or content blocked before

    generation.


    **Authentication.** All requests require an API key sent as a bearer token:


    Authorization: Bearer bpx_live_xxx


    Create and manage keys from your BudgetPixel account dashboard. The developer

    API is available on **every paid plan**. On the **Free** plan, API keys can call

    the free library searches only: `GET /v1/stock/images`,

    `GET /v1/stock/sound-effects` and `GET /v1/stock/music`.


    **Pricing.** API usage is metered in credits at each model''s published price

    (see `GET /v1/models`), and your plan''s model discounts and active promotions

    apply to API charges exactly as they do on the web — `POST /v1/cost` quotes

    your discounted price. Pro and Ultra plans include a daily free-models

    allowance (a shared pool of free generations per day across qualified image

    models such as FLUX 2 Klein and Qwen-Image) that covers API

    requests too — the standard price applies once the day''s pool is used.

    Other promotional free daily generations remain web/app-only. Failed

    generations are never charged.


    **Rate limits.** Requests are limited per minute: **600 requests/min per API

    key** and **1200 requests/min per source IP** (defaults; subject to tuning).

    Every response carries `X-RateLimit-Limit`, `X-RateLimit-Remaining`, and

    `X-RateLimit-Reset` (seconds until the window resets). Exceeding a limit

    returns HTTP `429` with a `Retry-After` header — wait that long before

    retrying. Rejected requests still count against the window, so a tight retry

    loop keeps you limited; back off instead. Generation jobs additionally have a

    per-plan concurrency cap (the same one as the web workshop), independent of

    these request limits. `POST /v1/uploads` also has a dedicated **60 uploads/min

    per account** cap (it''s free/unmetered) on top of these limits. Every `429`

    this API returns carries `Retry-After`, including a full concurrency queue

    (a suggested wait) and the monthly spend limit (seconds until the month

    resets).


    **Output retention.** Generated files are kept for 24 hours after the job is

    created. Job status responses give the exact time as `expires_at`; after it,

    `expired` is `true` and no download URLs are returned.'
  title: BudgetPixel Conversions API
  version: '2026-06-20'
servers:
- description: Production
  url: https://api.budgetpixel.com/v1
security:
- ApiKeyAuth: []
tags:
- description: Format conversion for images, video, and audio
  name: Conversions
paths:
  /convert/audio:
    post:
      description: 'Convert audio to `mp3`, `wav`, `ogg`, or `m4a`. **Synchronous** — the converted

        file''s download URL is in the response.


        **Pricing: 3 credits per conversion**, charged only on success. Estimate via

        `POST /v1/cost` with

        `{"model": "convert-audio"}`.


        `file` accepts a public URL (up to 30 MB), an uploaded-file URL from

        `POST /v1/uploads`, a data URI, or raw

        base64. Input limit 30 MB. Results are stored privately and deleted after 7 days.'
      operationId: convertAudio
      requestBody:
        content:
          application/json:
            schema:
              properties:
                file:
                  description: The audio to convert — public URL, uploaded-file URL, data URI, or raw base64.
                  type: string
                target:
                  description: Output format.
                  enum:
                  - mp3
                  - wav
                  - ogg
                  - m4a
                  type: string
              required:
              - file
              - target
              type: object
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConvertResponse'
          description: Converted. Download from `url` (valid several hours; file kept 7 days).
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Insufficient credits for this conversion.
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      summary: Convert an audio file
      tags:
      - Conversions
  /convert/image:
    post:
      description: 'Convert an image to `png`, `jpg`, `webp`, or `gif`. **Synchronous** — the converted

        file''s download URL is in the response (no job to poll).


        **Pricing: 2 credits per conversion**, charged only on success. Estimate via

        `POST /v1/cost` with

        `{"model": "convert-image"}`.


        `file` accepts a public URL (up to 30 MB), an uploaded-file URL from

        `POST /v1/uploads`, a data URI, or raw

        base64. Input limit 20 MB. Results are stored privately and deleted after 7 days.'
      operationId: convertImage
      requestBody:
        content:
          application/json:
            schema:
              properties:
                file:
                  description: The image to convert — public URL, uploaded-file URL, data URI, or raw base64.
                  type: string
                target:
                  description: Output format.
                  enum:
                  - png
                  - jpg
                  - webp
                  - gif
                  type: string
              required:
              - file
              - target
              type: object
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConvertResponse'
          description: Converted. Download from `url` (valid several hours; file kept 7 days).
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Insufficient credits for this conversion.
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      summary: Convert an image
      tags:
      - Conversions
  /convert/video:
    post:
      description: 'Convert a video to `mp4`, `webm`, `mov`, or `gif` (video→gif is palette-optimized).

        An animated GIF input converts to any video target (gif→mp4). **Synchronous** — the

        converted file''s download URL is in the response.


        **Pricing: 10 credits per conversion**, charged only on success. Estimate via

        `POST /v1/cost` with

        `{"model": "convert-video"}`.


        `file` accepts a public URL (up to 30 MB), an uploaded-file URL from

        `POST /v1/uploads` (up to 50 MB), a data

        URI, or raw base64. **Videos must be 30 seconds or shorter.** Results are stored

        privately and deleted after 7 days.'
      operationId: convertVideo
      requestBody:
        content:
          application/json:
            schema:
              properties:
                file:
                  description: The video (or animated GIF) to convert — public URL, uploaded-file URL, data URI, or raw base64.
                  type: string
                target:
                  description: Output format.
                  enum:
                  - mp4
                  - webm
                  - mov
                  - gif
                  type: string
              required:
              - file
              - target
              type: object
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConvertResponse'
          description: Converted. Download from `url` (valid several hours; file kept 7 days).
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Insufficient credits for this conversion.
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      summary: Convert a video
      tags:
      - Conversions
components:
  responses:
    BadRequest:
      content:
        application/json:
          schema:
            oneOf:
            - $ref: '#/components/schemas/Error'
            - $ref: '#/components/schemas/ModerationBlocked'
      description: The request was malformed, referenced an unavailable model, or was blocked by input content moderation (moderation blocks carry a `restriction_reason` — see ModerationBlocked).
    Unauthorized:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
      description: Missing or invalid API key.
    Forbidden:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
      description: Authenticated but not permitted (plan gate, ownership, account restriction). Content-moderation blocks are 400, not 403.
    TooManyRequests:
      content:
        application/json:
          schema:
            oneOf:
            - $ref: '#/components/schemas/Error'
            - $ref: '#/components/schemas/QueueFull'
      description: 'A limit was reached. Every `429` carries `Retry-After` (seconds). The

        per-minute rate limit, the upload limit and the hourly API post cap answer

        with the `Error` envelope, code `rate_limited`. The monthly spend limit answers with

        code `monthly_spend_limit_reached`, and its `Retry-After` counts down to the

        start of next month (raising the limit in the console clears it sooner).

        A full concurrency queue answers with the flat `QueueFull` body (3D jobs:

        the `Error` envelope with code `queue_full`); its `Retry-After` is a

        suggested wait, because a slot frees as soon as one of your running jobs

        finishes.

        '
      headers:
        Retry-After:
          description: Seconds to wait before retrying.
          schema:
            minimum: 1
            type: integer
  schemas:
    ConvertResponse:
      description: A completed format conversion. Download from `url`.
      properties:
        content_type:
          example: image/webp
          type: string
        credits_charged:
          description: Credits charged for this conversion (2 image / 10 video / 3 audio).
          type: integer
        filename:
          description: Suggested download filename.
          example: photo.webp
          type: string
        retention:
          example: 7 days
          type: string
        size_bytes:
          description: Converted file size in bytes.
          type: integer
        url:
          description: Signed download URL for the converted file (valid several hours; the file itself is kept 7 days).
          format: uri
          type: string
      type: object
    Error:
      properties:
        error:
          properties:
            code:
              description: Stable machine-readable code.
              example: model_not_available
              type: string
            message:
              type: string
            type:
              description: Error category.
              example: invalid_request_error
              type: string
          required:
          - type
          - code
          - message
          type: object
      required:
      - error
      type: object
    QueueFull:
      description: '`429` body when your account already has as many jobs of this kind

        (image, video or audio) in flight as its concurrency cap allows. Submit

        the next job when one of your running jobs finishes.

        '
      properties:
        active_jobs:
          description: Jobs of this kind in flight right now.
          type: integer
        code:
          enum:
          - queue_full
          type: string
        error:
          description: Human-readable message.
          type: string
        queue_full:
          enum:
          - true
          type: boolean
        queue_limit:
          description: Your concurrency cap for this kind of job.
          type: integer
        retry_after_seconds:
          description: Same value as the `Retry-After` header.
          type: integer
      required:
      - error
      - code
      - queue_full
      - queue_limit
      - active_jobs
      - retry_after_seconds
      type: object
    ModerationBlocked:
      description: Returned (with HTTP 400) when the input content moderation gate blocks a generation request. The block is a property of the request's prompt or input media — reword the prompt or change the input and retry. Branch on `restriction_reason`, which is stable and machine-readable.
      properties:
        error:
          description: Human-readable explanation of the block.
          type: string
        restriction_reason:
          description: Stable machine-readable block reason.
          enum:
          - input_csam
          - input_explicit_adult
          - input_upload_nudity
          - input_celebrity_likeness
          - strict_model_nsfw
          type: string
      required:
      - error
      - restriction_reason
      type: object
  securitySchemes:
    ApiKeyAuth:
      bearerFormat: bpx_live_*
      description: 'API key as a bearer token: Authorization: Bearer bpx_live_xxx'
      scheme: bearer
      type: http
