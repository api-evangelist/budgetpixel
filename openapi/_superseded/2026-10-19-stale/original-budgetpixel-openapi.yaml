                    $ref: '#/components/responses/BadRequest'
                "401":
                    $ref: '#/components/responses/Unauthorized'
                "403":
                    $ref: '#/components/responses/Forbidden'
                "429":
                    $ref: '#/components/responses/TooManyRequests'
            summary: Generate sound effect with Sonilo Video SFX
            tags:
                - Sound Effects
    /classifications/music-genre:
        post:
            description: |
                Classify one song into BudgetPixel's canonical music genre taxonomy —
                the same classifier that powers the site's music gallery. **Synchronous**:
                the response carries the genre plus style/mood tags and a confidence score.

                **Input**: one song (`audio`), max **20 MB** and **7 minutes**, as MP3, WAV,
                OGG, M4A, or FLAC. Accepts a public URL, an uploaded-file URL from
                [`POST /v1/uploads`](/api-reference/files/upload-input-media), a data URI, or
                raw base64. Tip: a 7-minute WAV exceeds 20 MB — use MP3 for long tracks.

                The classifier listens to a ~30-second excerpt sampled from ~25% into the
                track (the `clip` field in the response tells you the exact window). Only
                that excerpt is retained — privately, for ~1 day — never the full upload.

                **Pricing: flat 10 credits per song.** Estimate via
                [`POST /v1/cost`](/api-reference/models/estimate-the-cost-of-a-request) with
                `{"model": "music-genre"}`. Charged on success only — a classifier failure
                costs nothing.
            operationId: classifyMusicGenre
            requestBody:
                content:
                    application/json:
                        schema:
                            properties:
                                audio:
                                    description: One song (public URL, uploaded-file URL, data URI, or raw base64). Max 20 MB and 7 minutes. MP3/WAV/OGG/M4A/FLAC.
                                    type: string
                            required:
                                - audio
                            type: object
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                properties:
                                    clip:
                                        description: The excerpt the classifier heard.
                                        properties:
                                            duration_seconds:
                                                type: number
                                            start_seconds:
                                                type: number
                                        type: object
                                    confidence:
                                        description: Classifier confidence, 0-1.
                                        type: number
                                    credits_charged:
                                        type: integer
                                    genre:
                                        description: Canonical genre, e.g. `Electronic & Dance`. One of the site's music genres.
                                        type: string
                                    genre_slug:
                                        description: URL-safe slug of the genre, e.g. `electronic-and-dance`.
                                        type: string
                                    id:
                                        description: Classification request id (audit reference).
                                        type: string
                                    mood:
                                        description: One short mood phrase.
                                        type: string
                                    tags:
                                        description: 3-6 style/mood/instrument tags.
                                        items:
                                            type: string
                                        type: array
                                type: object
                    description: The classification.
                "400":
                    $ref: '#/components/responses/BadRequest'
                "401":
                    $ref: '#/components/responses/Unauthorized'
                "402":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: Insufficient credits.
                "429":
                    $ref: '#/components/responses/TooManyRequests'
            summary: Classify a song's music genre
            tags:
                - Classification
    /convert/audio:
        post:
            description: |
                Convert audio to `mp3`, `wav`, `ogg`, or `m4a`. **Synchronous** — the converted
                file's download URL is in the response.

                **Pricing: 3 credits per conversion**, charged only on success. Estimate via
                [`POST /v1/cost`](/api-reference/models/estimate-the-cost-of-a-request) with
                `{"model": "convert-audio"}`.

                `file` accepts a public URL (up to 30 MB), an uploaded-file URL from
                [`POST /v1/uploads`](/api-reference/files/upload-input-media), a data URI, or raw
                base64. Input limit 30 MB. Results are stored privately and deleted after 7 days.
            operationId: convertAudio
            requestBody:
                content:
                    application/json:
                        schema:
                            properties:
                                file:
                                    description: The audio to convert — public URL, uploaded-file URL, data URI, or raw base64.
                                    type: string
                                target:
                                    description: Output format.
                                    enum:
                                        - mp3
                                        - wav
                                        - ogg
                                        - m4a
                                    type: string
                            required:
                                - file
                                - target
                            type: object
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ConvertResponse'
                    description: Converted. Download from `url` (valid several hours; file kept 7 days).
                "400":
                    $ref: '#/components/responses/BadRequest'
                "401":
                    $ref: '#/components/responses/Unauthorized'
                "402":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: Insufficient credits for this conversion.
                "403":
                    $ref: '#/components/responses/Forbidden'
                "429":
                    $ref: '#/components/responses/TooManyRequests'
            summary: Convert an audio file
            tags:
                - Conversions
