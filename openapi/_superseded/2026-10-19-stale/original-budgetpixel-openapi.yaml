components:
    responses:
        BadRequest:
            content:
                application/json:
                    schema:
                        oneOf:
                            - $ref: '#/components/schemas/Error'
                            - $ref: '#/components/schemas/ModerationBlocked'
            description: The request was malformed, referenced an unavailable model, or was blocked by input content moderation (moderation blocks carry a `restriction_reason` — see ModerationBlocked).
        Forbidden:
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/Error'
            description: Authenticated but not permitted (plan gate, ownership, account restriction). Content-moderation blocks are 400, not 403.
        NotFound:
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/Error'
            description: The requested job was not found.
        TooManyRequests:
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/Error'
            description: Rate or queue limit reached. Retry after a short delay.
        Unauthorized:
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/Error'
            description: Missing or invalid API key.
    schemas:
        AudioJob:
            properties:
                audio_url:
                    description: The generated track or sound effect (signed URL, valid several hours); present once `status=succeeded`.
                    format: uri
                    type: string
                created_at:
                    format: date-time
                    type: string
                error:
                    type: string
                id:
                    example: aud_a1b2c3d4e5f6
                    type: string
                model:
                    type: string
                status:
                    $ref: '#/components/schemas/JobStatus'
                video_url:
                    description: Video-to-sound-effect jobs only — the input video with the generated effects mixed in (signed URL, valid several hours); present once `status=succeeded`.
                    format: uri
                    type: string
            type: object
        ConvertResponse:
            description: A completed format conversion. Download from `url`.
            properties:
                content_type:
                    example: image/webp
                    type: string
                credits_charged:
                    description: Credits charged for this conversion (2 image / 10 video / 3 audio).
                    type: integer
                filename:
                    description: Suggested download filename.
                    example: photo.webp
                    type: string
                retention:
                    example: 7 days
                    type: string
                size_bytes:
                    description: Converted file size in bytes.
                    type: integer
                url:
                    description: Signed download URL for the converted file (valid several hours; the file itself is kept 7 days).
                    format: uri
                    type: string
            type: object
        CostEstimate:
            description: The credit cost of a request. The real charge is always ≤ `credits` (failures cost nothing; sequential image jobs may use fewer images).
            properties:
                credits:
                    description: Credits the request will cost — the maximum, for non-deterministic cases.
                    example: 2750
                    type: integer
                exact:
                    description: True when the cost is exact; false when `credits` is an upper bound (e.g. seedream sequential, where the model picks the image count).
                    type: boolean
                model:
                    example: seedance-2.0
                    type: string
                type:
                    enum:
                        - image
                        - video
                        - audio
                        - conversion
                        - social
                        - moderation
                        - classification
                        - motion
                        - lip-sync
                        - upscale
                        - video-upscale
                    type: string
            required:
                - model
                - type
                - credits
                - exact
            type: object
        CreateAudioResponse:
            properties:
                id:
                    description: Opaque job id — use it to poll status.
                    example: aud_a1b2c3d4e5f6
                    type: string
                message:
                    type: string
                model:
                    type: string
                status:
                    $ref: '#/components/schemas/JobStatus'
            type: object
        CreateImageResponse:
            properties:
                id:
                    description: Opaque job id — use it to poll status.
                    example: img_a1b2c3d4e5f6
                    type: string
                message:
                    type: string
                model:
                    type: string
                status:
                    $ref: '#/components/schemas/JobStatus'
            type: object
        CreateMotionResponse:
            properties:
                credits:
                    description: Total price of this job (seconds x the model's per-second rate).
                    type: integer
                id:
                    description: Opaque job id (`mtn_...`) — use it to poll status.
                    type: string
                message:
                    type: string
                model:
                    type: string
                seconds:
                    description: Billed duration — the reference video's length
                    rounded up.: null
                    type: integer
                status:
                    $ref: '#/components/schemas/JobStatus'
            type: object
        CreatePostResponse:
            description: A published post.
            properties:
                credits_charged:
                    example: 10
                    type: integer
                id:
                    description: The post id.
                    type: integer
                media_type:
                    enum:
                        - image
                        - video
                        - audio
                    type: string
                moderation:
                    description: Image/video posts are rated after publish; feed visibility follows the review.
                    example: pending
                    type: string
                url:
                    description: Public URL of the post.
                    example: https://budgetpixel.com/p/12345
                    format: uri
                    type: string
            type: object
        CreateUpscaleResponse:
            properties:
                credits:
                    description: Total price of this job (flat per image
                    or the target-resolution tier for p-image-upscale).: null
                    type: integer
                id:
                    description: Opaque job id — use it to poll status.
                    type: string
                message:
                    type: string
                model:
                    type: string
                status:
                    $ref: '#/components/schemas/JobStatus'
            type: object
        CreateVideoResponse:
            properties:
                id:
                    description: Opaque job id — use it to poll status.
                    type: string
                message:
                    type: string
                model:
                    type: string
                status:
                    $ref: '#/components/schemas/JobStatus'
            type: object
        CreditBalance:
            properties:
                extra_credits:
                    description: Purchased credits that don't reset monthly.
                    type: integer
                monthly_limit:
                    type: integer
                monthly_remaining:
                    type: integer
                monthly_used:
                    type: integer
                total_available:
                    description: Total spendable credits (monthly remaining + extra).
                    type: integer
            type: object
        Error:
            properties:
                error:
                    properties:
                        code:
                            description: Stable machine-readable code.
                            example: model_not_available
                            type: string
                        message:
                            type: string
                        type:
                            description: Error category.
                            example: invalid_request_error
                            type: string
                    required:
                        - type
                        - code
                        - message
                    type: object
            required:
                - error
            type: object
        ImageJob:
            properties:
                created_at:
                    format: date-time
                    type: string
                error:
                    type: string
                id:
                    example: img_a1b2c3d4e5f6
                    type: string
                images:
                    description: Generated images (presigned URLs); present once `status=succeeded`.
                    items:
                        $ref: '#/components/schemas/ImageOutput'
                    type: array
                model:
                    type: string
                status:
                    $ref: '#/components/schemas/JobStatus'
            type: object
        ImageOutput:
            description: A generated image as a short-lived presigned URL.
            properties:
                position:
                    type: integer
                url:
                    format: uri
                    type: string
            type: object
        JobStatus:
            description: Lifecycle state. `succeeded`/`failed`/`timeout` are terminal.
            enum:
                - pending
                - starting
                - processing
                - completing
                - succeeded
                - failed
                - timeout
            type: string
        LipSyncJob:
            properties:
                completed_at:
                    format: date-time
                    type: string
                created_at:
                    format: date-time
                    type: string
                error_message:
                    type: string
                id:
                    type: string
                model:
                    type: string
                status:
                    description: Lifecycle state. `succeeded`/`failed`/`canceled` are terminal.
                    enum:
                        - pending
                        - processing
                        - succeeded
                        - failed
                        - canceled
                    type: string
                video_url:
                    description: Short-lived presigned URL; present once `status=succeeded`.
                    format: uri
                    type: string
            type: object
        Model:
            properties:
                credits_per_generation:
                    description: Per-output-image cost (images) or per-track cost (music). 0 for per-second models (video, sound effects) — see credits_per_unit.
                    example: 45
                    type: integer
                credits_per_unit:
                    description: Per-unit cost for metered models (e.g. per second of video). For resolution-priced models this is the default resolution's rate.
                    example: 220
                    type: integer
                min_billable_seconds:
                    description: Billing floor for per-second audio models (sound effects, Sonilo Music) — cost = credits_per_unit × max(min_billable_seconds, seconds rounded up). Absent for flat-priced models.
                    example: 3
                    type: integer
                name:
                    example: flux-2-klein
                    type: string
                resolution_pricing:
                    additionalProperties:
                        type: integer
                    description: For video models whose per-second rate varies by resolution, a map of resolution to per-second cost. Absent when pricing is flat.
                    example:
                        4k: 1250
                        480p: 100
                        720p: 220
                        1080p: 550
                    type: object
                type:
                    enum:
                        - image
                        - video
                        - audio
                    type: string
                unit_type:
                    description: The unit `credits_per_unit` applies to.
                    enum:
                        - generation
                        - second
                    type: string
            required:
                - name
                - type
                - credits_per_generation
            type: object
        ModerationBlocked:
            description: Returned (with HTTP 400) when the input content moderation gate blocks a generation request. The block is a property of the request's prompt or input media — reword the prompt or change the input and retry. Branch on `restriction_reason`, which is stable and machine-readable.
            properties:
                error:
                    description: Human-readable explanation of the block.
                    type: string
                restriction_reason:
                    description: Stable machine-readable block reason.
                    enum:
                        - input_csam
                        - input_explicit_adult
                        - input_upload_nudity
                        - input_celebrity_likeness
                        - strict_model_nsfw
                    type: string
            required:
                - error
                - restriction_reason
            type: object
        MotionJob:
            properties:
                completed_at:
                    format: date-time
                    type: string
                created_at:
                    format: date-time
                    type: string
                error_message:
                    type: string
                id:
                    type: string
                model:
                    type: string
                status:
                    description: Lifecycle state. `succeeded`/`failed`/`canceled` are terminal.
                    enum:
                        - pending
                        - processing
                        - succeeded
                        - failed
                        - canceled
                    type: string
                video_url:
                    description: Short-lived presigned URL; present once `status=succeeded`.
                    format: uri
                    type: string
            type: object
        UploadResponse:
            description: A stored, ephemeral input file. Pass `url` as a media parameter on a generation request.
            properties:
                bytes:
                    description: Stored file size in bytes.
                    type: integer
                content_type:
                    example: image/png
                    type: string
                expires_in:
                    description: Seconds the file is retained (~86400).
                    type: integer
                url:
                    description: Short-lived URL to use as a media input (valid ~24h).
                    format: uri
                    type: string
            type: object
        UpscaleJob:
            properties:
                completed_at:
                    format: date-time
                    type: string
                created_at:
                    format: date-time
                    type: string
                error_message:
                    type: string
                id:
                    type: string
                image_url:
                    description: Short-lived presigned URL of the upscaled image; present once `status=succeeded`.
                    format: uri
                    type: string
                model:
                    type: string
                status:
                    description: Lifecycle state. `succeeded`/`failed`/`canceled` are terminal.
                    enum:
                        - pending
                        - processing
                        - succeeded
                        - failed
                        - canceled
                    type: string
            type: object
        VideoJob:
            properties:
                aspect_ratio:
                    type: string
                completed_at:
                    format: date-time
                    type: string
                created_at:
                    format: date-time
                    type: string
                error_message:
                    type: string
                id:
                    type: string
                length_seconds:
                    type: integer
                model:
                    type: string
                started_at:
                    format: date-time
                    type: string
                status:
                    $ref: '#/components/schemas/JobStatus'
                updated_at:
                    format: date-time
                    type: string
                video_url:
                    description: Short-lived presigned URL; present once `status=succeeded`.
                    format: uri
                    type: string
            type: object
    securitySchemes:
        ApiKeyAuth:
            bearerFormat: bpx_live_*
            description: 'API key as a bearer token: Authorization: Bearer bpx_live_xxx'
            scheme: bearer
            type: http
info:
    contact:
        email: support@budgetpixel.com
        name: BudgetPixel Support
    description: |
        The BudgetPixel developer API for programmatic image, video, music and
        sound-effect generation.

        Generation is **asynchronous**: you create a job, then poll its status until it
        reaches a terminal state (`succeeded` / `failed`). You are charged in credits
        only on success — never for failures, timeouts, or content blocked before
        generation.

        **Authentication.** All requests require an API key sent as a bearer token:

            Authorization: Bearer bpx_live_xxx

        Create and manage keys from your BudgetPixel account dashboard. The developer
        API is available on the **Premium** plan and above.

        **Pricing.** API usage is metered in credits at each model's published price
        (see `GET /v1/models`), and your plan's model discounts and active promotions
        apply to API charges exactly as they do on the web — `POST /v1/cost` quotes
        your discounted price. Pro and Ultra plans include a daily free-models
        allowance (a shared pool of free generations per day across qualified image
        models such as FLUX 2 Klein and Qwen-Image) that covers API
        requests too — the standard price applies once the day's pool is used.
        Other promotional free daily generations remain web/app-only. Failed
        generations are never charged.

        **Rate limits.** Requests are limited per minute: **600 requests/min per API
        key** and **1200 requests/min per source IP** (defaults; subject to tuning).
        Every response carries `X-RateLimit-Limit`, `X-RateLimit-Remaining`, and
        `X-RateLimit-Reset` (seconds until the window resets). Exceeding a limit
        returns HTTP `429` with a `Retry-After` header — wait that long before
        retrying. Rejected requests still count against the window, so a tight retry
        loop keeps you limited; back off instead. Generation jobs additionally have a
        per-plan concurrency cap (the same one as the web workshop), independent of
        these request limits. `POST /v1/uploads` also has a dedicated **60 uploads/min
        per account** cap (it's free/unmetered) on top of these limits.
    title: BudgetPixel API
    version: "2026-06-20"
openapi: 3.1.0
paths:
    /account/credits:
        get:
            operationId: getCredits
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/CreditBalance'
                    description: Current credit balance for the account.
                "401":
                    $ref: '#/components/responses/Unauthorized'
            summary: Get credit balance
            tags:
                - Account
    /audios/{job_id}:
        get:
            description: |
                Poll until `status` is `succeeded`. The generated track (or sound effect) is
                returned as a short-lived signed `audio_url` (valid for several hours; re-call
                this endpoint for a fresh URL anytime — the underlying object is deleted 24h
                after generation). Serves every `POST /v1/audios/{model}` job — music and
                sound effects alike.
            operationId: getAudio
            parameters:
                - description: The opaque job id returned by the create endpoint (e.g. `aud_...`).
                  in: path
                  name: job_id
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/AudioJob'
                    description: Current job status. `audio_url` is populated once succeeded.
                "401":
                    $ref: '#/components/responses/Unauthorized'
                "403":
                    $ref: '#/components/responses/Forbidden'
                "404":
                    $ref: '#/components/responses/NotFound'
            summary: Get music job status
            tags:
                - Audios
    /audios/lyria-3:
        post:
            description: |-
                Google Lyria 3 — high-fidelity music from a text prompt, with optional lyrics and up to 10 reference images to condition the mood. MP3 output (SynthID-watermarked).

                **Asynchronous.** Returns a job `id` (the track is not in this response). Poll [`GET /v1/audios/{id}`](/api-reference/audios/get-music-job-status) until `status` is `succeeded` — the track URL is in that response's `audio_url`.
            operationId: createAudio_lyria_3
            requestBody:
                content:
                    application/json:
                        schema:
                            properties:
                                images:
                                    description: Optional reference images (up to 10) to condition the track's mood/theme. Each item is a public image URL, a data URI, raw base64, or an uploaded-file URL from POST /v1/uploads.
                                    items:
                                        type: string
                                    maxItems: 10
                                    type: array
                                lyrics:
                                    description: Optional lyrics (up to 3000 characters).
                                    type: string
                                prompt:
                                    description: Description of the music to generate (10-2000 characters).
                                    type: string
                            required:
                                - prompt
                            type: object
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/CreateAudioResponse'
                    description: Job accepted.
                "400":
                    $ref: '#/components/responses/BadRequest'
                "401":
                    $ref: '#/components/responses/Unauthorized'
                "403":
                    $ref: '#/components/responses/Forbidden'
                "429":
                    $ref: '#/components/responses/TooManyRequests'
            summary: Generate music with Lyria 3
            tags:
                - Music
    /audios/mureka-v9:
        post:
            description: |-
                Mureka V9 — songs that sing your exact lyrics (structural tags like [verse]/[chorus] supported) with a vocal gender preference, or instrumental/BGM tracks from a prompt. MP3 output.

                **Asynchronous.** Returns a job `id` (the track is not in this response). Poll [`GET /v1/audios/{id}`](/api-reference/audios/get-music-job-status) until `status` is `succeeded` — the track URL is in that response's `audio_url`.
            operationId: createAudio_mureka_v9
            requestBody:
                content:
                    application/json:
                        schema:
                            properties:
                                instrumental:
                                    default: false
                                    description: Generate an instrumental/BGM track from the prompt (no vocals, lyrics ignored).
                                    type: boolean
                                lyrics:
                                    description: Lyrics to sing verbatim (1-5000 characters; [verse]/[chorus]/[bridge] tags supported). Required for songs; ignored for instrumental tracks.
                                    type: string
                                prompt:
                                    description: Style hint (up to 1024 characters). Optional for songs; required for instrumental tracks.
                                    type: string
                                vocal_gender:
                                    default: auto
                                    description: Preferred vocal gender for songs.
                                    enum:
                                        - auto
                                        - female
                                        - male
                                    type: string
                            type: object
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/CreateAudioResponse'
                    description: Job accepted.
                "400":
                    $ref: '#/components/responses/BadRequest'
                "401":
                    $ref: '#/components/responses/Unauthorized'
                "403":
                    $ref: '#/components/responses/Forbidden'
                "429":
                    $ref: '#/components/responses/TooManyRequests'
            summary: Generate music with Mureka V9
            tags:
                - Music
    /audios/music-2.6:
        post:
            description: |-
                MiniMax Music 2.6 — full-length songs from a style prompt and/or your own lyrics. Lyrics optimizer can write or polish lyrics from the prompt; instrumental mode skips vocals. MP3 or WAV output.

                **Asynchronous.** Returns a job `id` (the track is not in this response). Poll [`GET /v1/audios/{id}`](/api-reference/audios/get-music-job-status) until `status` is `succeeded` — the track URL is in that response's `audio_url`.
            operationId: createAudio_music_2_6
            requestBody:
                content:
                    application/json:
                        schema:
                            properties:
                                format:
                                    default: wav
                                    description: Output audio format. Defaults to wav (lossless); choose mp3 for a smaller file.
                                    enum:
                                        - wav
                                        - mp3
                                    type: string
                                instrumental:
                                    default: false
                                    description: Generate an instrumental track (no vocals).
                                    type: boolean
                                lyrics:
                                    description: Lyrics to sing (1-3500 characters). Required unless instrumental is true or lyrics_optimizer is true (the optimizer writes lyrics from the prompt).
                                    type: string
                                lyrics_optimizer:
                                    default: true
                                    description: Let the model write or polish lyrics from the prompt. Default true.
                                    type: boolean
                                prompt:
                                    description: Style/mood description of the track (up to 2000 characters). Optional when lyrics are provided.
                                    type: string
                            type: object
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/CreateAudioResponse'
                    description: Job accepted.
                "400":
                    $ref: '#/components/responses/BadRequest'
                "401":
                    $ref: '#/components/responses/Unauthorized'
                "403":
                    $ref: '#/components/responses/Forbidden'
                "429":
                    $ref: '#/components/responses/TooManyRequests'
            summary: Generate music with Music 2.6
            tags:
                - Music
    /audios/music-3.0:
        post:
            description: |-
                MiniMax Music 3.0 — the latest MiniMax music model: full-length songs from a style prompt and/or your own lyrics. Lyrics optimizer can write or polish lyrics from the prompt; instrumental mode skips vocals. WAV or MP3 output.

                **Asynchronous.** Returns a job `id` (the track is not in this response). Poll [`GET /v1/audios/{id}`](/api-reference/audios/get-music-job-status) until `status` is `succeeded` — the track URL is in that response's `audio_url`.
            operationId: createAudio_music_3_0
            requestBody:
                content:
                    application/json:
                        schema:
                            properties:
                                format:
                                    default: wav
                                    description: Output audio format. Defaults to wav (lossless); choose mp3 for a smaller file.
                                    enum:
                                        - wav
                                        - mp3
                                    type: string
                                instrumental:
                                    default: false
                                    description: Generate an instrumental track (no vocals).
                                    type: boolean
                                lyrics:
                                    description: Lyrics to sing (1-3500 characters). Required unless instrumental is true or lyrics_optimizer is true (the optimizer writes lyrics from the prompt).
                                    type: string
                                lyrics_optimizer:
                                    default: true
                                    description: Let the model write or polish lyrics from the prompt. Default true.
                                    type: boolean
                                prompt:
                                    description: Style/mood description of the track (up to 2000 characters). Optional when lyrics are provided.
                                    type: string
                            type: object
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/CreateAudioResponse'
                    description: Job accepted.
                "400":
                    $ref: '#/components/responses/BadRequest'
                "401":
                    $ref: '#/components/responses/Unauthorized'
                "403":
                    $ref: '#/components/responses/Forbidden'
                "429":
                    $ref: '#/components/responses/TooManyRequests'
            summary: Generate music with Music 3.0
            tags:
                - Music
    /audios/sonilo-music:
        post:
            description: |-
                Sonilo text-to-music — licensed instrumental and background music of an exact length (5-360 seconds) from a text prompt: soundtracks for videos, ads, apps and games. Priced per second of the requested duration with a 10-second minimum (rate in GET /v1/models; POST /v1/cost quotes the exact price). MP3 or WAV output.

                **Asynchronous.** Returns a job `id` (the track is not in this response). Poll [`GET /v1/audios/{id}`](/api-reference/audios/get-music-job-status) until `status` is `succeeded` — the track URL is in that response's `audio_url`. Charged per second of the requested `duration` (10-second minimum; rate in `GET /v1/models`) on success only; `POST /v1/cost` quotes the exact price.
            operationId: createAudio_sonilo_music
            requestBody:
                content:
                    application/json:
                        schema:
                            properties:
                                duration:
                                    default: 30
                                    description: Length of the track in seconds (5-360). Billed per second with a 10-second minimum.
                                    maximum: 360
                                    minimum: 5
                                    type: integer
                                format:
                                    default: mp3
                                    description: Output audio format.
                                    enum:
                                        - mp3
                                        - wav
                                    type: string
                                prompt:
                                    description: Description of the music (up to 2000 characters; even a few words work), e.g. "30 seconds of upbeat electronic instrumental for a product launch video, no vocals".
                                    type: string
                            required:
                                - prompt
                            type: object
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/CreateAudioResponse'
                    description: Job accepted.
                "400":
                    $ref: '#/components/responses/BadRequest'
                "401":
                    $ref: '#/components/responses/Unauthorized'
                "403":
                    $ref: '#/components/responses/Forbidden'
                "429":
                    $ref: '#/components/responses/TooManyRequests'
            summary: Generate music with Sonilo Music
            tags:
                - Music
    /audios/sonilo-sfx:
        post:
            description: |-
                Sonilo text-to-sound-effect — Foley, ambience, UI sounds, transitions, impacts and action effects from a short description, 1-180 seconds long. Priced per second of the requested duration with a 3-second minimum (see GET /v1/models for the rate; POST /v1/cost quotes the exact price). MP3 or WAV output.

                **Asynchronous.** Returns a job `id` (the sound effect is not in this response). Poll [`GET /v1/audios/{id}`](/api-reference/audios/get-music-job-status) until `status` is `succeeded` — the clip URL is in that response's `audio_url`. Charged per second of the requested `duration` (3-second minimum; rate in `GET /v1/models`) on success only; `POST /v1/cost` quotes the exact price.
            operationId: createAudio_sonilo_sfx
            requestBody:
                content:
                    application/json:
                        schema:
                            properties:
                                duration:
                                    default: 10
                                    description: Length of the effect in seconds (1-180). Billed per second with a 3-second minimum.
                                    maximum: 180
                                    minimum: 1
                                    type: integer
                                format:
                                    default: mp3
                                    description: Output audio format.
                                    enum:
                                        - mp3
                                        - wav
                                    type: string
                                prompt:
                                    description: Description of the sound effect (up to 1000 characters), e.g. "heavy rain on a tin roof with distant thunder".
                                    type: string
                            required:
                                - prompt
                            type: object
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/CreateAudioResponse'
                    description: Job accepted.
                "400":
                    $ref: '#/components/responses/BadRequest'
                "401":
                    $ref: '#/components/responses/Unauthorized'
                "403":
                    $ref: '#/components/responses/Forbidden'
                "429":
                    $ref: '#/components/responses/TooManyRequests'
            summary: Generate sound effect with Sonilo SFX
            tags:
                - Sound Effects
    /audios/sonilo-video-sfx:
        post:
            description: |-
                Sonilo video-to-sound-effect — frame-accurate Foley, ambience, impacts and action sounds synced to the visible events of an input video (up to 6 minutes). Returns the SFX track (`audio_url`, MP3 or WAV) and the video with the effects mixed in (`video_url`). Priced per second of the input video's measured duration (whole seconds, 3-second minimum) — see GET /v1/models for the rate.

                **Asynchronous.** Returns a job `id` (nothing is generated yet in this response). Poll [`GET /v1/audios/{id}`](/api-reference/audios/get-music-job-status) until `status` is `succeeded` — the SFX track is that response's `audio_url` and the input video with the effects mixed in is its `video_url`. Charged per second of the input video's measured duration (whole seconds, 3-second minimum; rate in `GET /v1/models`) on success only.
