            summary: Generate video with SeeDance 2.5
            tags:
                - ByteDance (SeeDance)
    /videos/wan-2.7-video:
        post:
            description: |-
                Alibaba Wan 2.7 (video) — text-to-video; image-to-video with a start frame and an optional end frame; and video editing (supply a `video`). Prompt-driven narrative, optional generated audio, and an optional driving-audio track. 720p or 1080p, priced per resolution (see `resolution_pricing` in GET /v1/models); 5, 10, or 15 seconds. Video editing instead takes its length from the input clip (`length_seconds` and `aspect_ratio` are ignored) and bills the INPUT duration on top of the output at the same per-second rate — so a 10s clip costs 20 seconds' worth; estimate via POST /v1/cost. (The Wan 2.7 image model is `wan-2.7` under POST /v1/images.)

                **Asynchronous.** Returns a job `id` (the video is not in this response). Poll [`GET /v1/videos/{id}`](/api-reference/videos/get-video-job-status) until `status` is `succeeded` — the video URL is in that response's `video_url`.
            operationId: createVideo_wan_2_7_video
            requestBody:
                content:
                    application/json:
                        schema:
                            properties:
                                aspect_ratio:
                                    default: "16:9"
                                    description: Aspect ratio. Ignored when a start image or an input `video` already sets the frame.
                                    enum:
                                        - "16:9"
                                        - "9:16"
                                        - "1:1"
                                        - "4:3"
                                        - "3:4"
                                    type: string
                                audio:
                                    description: Optional driving-audio track (MP3/WAV/OGG) for the generated video. Provide a public audio URL or an uploaded-file URL from POST /v1/uploads (passed by URL, not inlined). Ignored when `generate_audio` is false.
                                    type: string
                                end_image:
                                    description: Optional end frame, used together with `image` (the start frame) to interpolate the video between the two frames. Same input forms as `image`.
                                    type: string
                                generate_audio:
                                    default: true
                                    description: Generate audio with the video (default true; no price impact).
                                    type: boolean
                                image:
                                    description: Optional start frame for image-to-video. Provide a public image URL, a data URI, raw base64, or an uploaded-file URL from POST /v1/uploads. Omit for text-to-video. Can't be combined with `video`.
                                    type: string
                                length_seconds:
                                    default: 5
                                    description: Video length in seconds. Ignored for video editing, which inherits the input clip's length.
                                    enum:
                                        - 5
                                        - 10
                                        - 15
                                    type: integer
                                prompt:
                                    description: Text description of the video, or the edit instruction when `video` is supplied (for example "change the video to an 8-bit pixel style").
                                    type: string
                                reference_images:
                                    description: Optional reference images (up to 4, free) used only with `video` — they guide the edit, for example supplying the person or style to apply to the clip. Each item is a public image URL, a data URI, raw base64, or an uploaded-file URL from POST /v1/uploads.
                                    items:
                                        type: string
                                    maxItems: 4
                                    type: array
                                resolution:
                                    default: 720p
                                    description: Output resolution. Pricing varies by resolution — see `resolution_pricing` in GET /v1/models.
                                    enum:
                                        - 720p
                                        - 1080p
                                    type: string
                                video:
                                    description: 'Optional input video to edit (2-15s, MP4/MOV, ≤100MB). Supplying it switches the request to video editing: the model applies `prompt` to this clip. Provide a public video URL or an uploaded-file URL from POST /v1/uploads (videos are passed by URL, not inlined). Billed on the INPUT duration at the full per-second rate in addition to the output — estimate via POST /v1/cost. Can''t be combined with `image`/`end_image`.'
                                    type: string
                            required:
                                - prompt
                            type: object
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/CreateVideoResponse'
                    description: Job accepted.
                "400":
                    $ref: '#/components/responses/BadRequest'
                "401":
                    $ref: '#/components/responses/Unauthorized'
                "403":
                    $ref: '#/components/responses/Forbidden'
                "429":
                    $ref: '#/components/responses/TooManyRequests'
            summary: Generate video with Wan 2.7
            tags:
                - Alibaba
    /videos/wan-3.0-video:
        post:
            description: |-
                Alibaba Wan 3.0 — all-in-one video generation up to 30 seconds at 30fps. Text-to-video; image-to-video (first + optional last frame); and reference-to-video mixing up to 10 reference images, up to 5 reference video clips (15s combined) for editing/replication/extension, and up to 5 reference audio clips (15s combined). In reference mode the prompt can address assets by order ("Image 1", "Video 1"). Reference media can't be combined with start/end frames. 480p/720p/1080p, priced per OUTPUT second by resolution (input media is free — see `resolution_pricing` in GET /v1/models); any duration 2-30 seconds (input video + output ≤ 30s); optional audio.

                **Asynchronous.** Returns a job `id` (the video is not in this response). Poll [`GET /v1/videos/{id}`](/api-reference/videos/get-video-job-status) until `status` is `succeeded` — the video URL is in that response's `video_url`.
            operationId: createVideo_wan_3_0_video
            requestBody:
                content:
                    application/json:
                        schema:
                            properties:
                                aspect_ratio:
                                    default: adaptive
                                    description: Aspect ratio, honored in every mode (an explicit ratio reframes the output even with a first frame or reference media). "adaptive" (default) lets the model pick a suitable ratio from the inputs and prompt intent.
                                    enum:
                                        - adaptive
                                        - "16:9"
                                        - "9:16"
                                        - "1:1"
                                        - "4:3"
                                        - "3:4"
                                    type: string
                                end_image:
                                    description: Optional last frame, used together with `image` (the first frame) to interpolate the video between the two frames. Same input forms as `image`.
                                    type: string
                                generate_audio:
                                    default: true
                                    description: Generate audio with the video (default true; no price impact).
                                    type: boolean
                                image:
                                    description: Optional first frame for image-to-video. Provide a public image URL, a data URI, raw base64, or an uploaded-file URL from POST /v1/uploads. Omit for text-to-video. Can't be combined with reference media.
                                    type: string
                                length_seconds:
                                    default: 5
                                    description: Output video length in seconds (2-30). With reference videos, input duration + output length must not exceed 30 seconds.
                                    maximum: 30
                                    minimum: 2
                                    type: integer
                                prompt:
                                    description: 'Text description of the video, or the edit instruction when reference videos are supplied. In reference mode, address assets by order: "Image 1", "Video 1", "Audio 1".'
                                    type: string
                                reference_audios:
                                    description: Optional reference audio clips (up to 5; each 2-15s, 15s combined; WAV/MP3) that guide sound/voice. Free. Each item is a public audio URL or an uploaded-file URL from POST /v1/uploads. Can't be combined with `image`/`end_image`.
                                    items:
                                        type: string
                                    maxItems: 5
                                    type: array
                                reference_images:
                                    description: Optional reference images (up to 10, free) that guide identity/style/scene in reference-to-video mode. Each item is a public image URL, a data URI, raw base64, or an uploaded-file URL from POST /v1/uploads. Can't be combined with `image`/`end_image`.
                                    items:
                                        type: string
                                    maxItems: 10
                                    type: array
                                reference_videos:
                                    description: Optional reference video clips (up to 5; each 2-15s, 15s combined; MP4/MOV, ≤50MB each) for editing, effect/camera replication, and extension. Each item is a public video URL or an uploaded-file URL from POST /v1/uploads (videos are passed by URL, not inlined). Free — only OUTPUT seconds are billed — but input video duration + `length_seconds` must not exceed 30. Can't be combined with `image`/`end_image`.
                                    items:
                                        type: string
                                    maxItems: 5
                                    type: array
                                resolution:
                                    default: 720p
                                    description: Output resolution. Pricing varies by resolution — see `resolution_pricing` in GET /v1/models.
                                    enum:
                                        - 480p
                                        - 720p
                                        - 1080p
                                    type: string
                                seed:
                                    description: Seed for reproducible generation. Omit for random.
                                    type: integer
                            required:
                                - prompt
                            type: object
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/CreateVideoResponse'
                    description: Job accepted.
                "400":
                    $ref: '#/components/responses/BadRequest'
                "401":
                    $ref: '#/components/responses/Unauthorized'
                "403":
                    $ref: '#/components/responses/Forbidden'
                "429":
                    $ref: '#/components/responses/TooManyRequests'
            summary: Generate video with Wan 3.0
            tags:
                - Alibaba
