source: https://docs.budgetpixel.com/concepts/async-jobs#errors and https://docs.budgetpixel.com/authentication
derived_from: openapi/budgetpixel-openapi.yaml components.responses + components.schemas.Error/ModerationBlocked
format: vendor-json
rfc9457: false
format_note: NOT RFC 9457. The API uses a nested vendor envelope {"error":{"type","code","message"}} served
  as application/json -- no application/problem+json media type, no type URI, no instance. Content-moderation
  blocks use a SECOND, FLATTER shape on the same 400 status, so a client must branch on body shape, not
  just status code.
envelope:
  primary:
    error:
      type: string -- error category
      code: string -- stable machine-readable code
      message: string -- human readable
  required:
  - error.type
  - error.code
  - error.message
  moderation:
    error: string -- human-readable explanation (a STRING here, not an object)
    restriction_reason: string enum -- stable machine-readable block reason
  warning: 'The two envelopes disagree on the TYPE of the `error` key: an object in the standard envelope,
    a bare string in a moderation block. Code that does response.error.code will read undefined on a moderation
    400.'
status_coverage:
