overage:
  model: Credit packs (pay-as-you-go). No required subscription; packs can be bought at any time and Pro/Ultra
    add a 5%/10% purchase bonus. A request that would exceed the available balance is REJECTED before
    the job is created rather than overdrafting.
  source: https://docs.budgetpixel.com/concepts/pricing-and-credits
metering:
  unit: credit
  charged_on: job success only -- failed, timed-out, and pre-generation-rejected requests are never charged
  images: per output image (credits_per_generation); a 3-image result costs 3x
  video: per second, and for several models per second BY RESOLUTION; some models also bill reference-VIDEO
    input seconds (seedance-2.x at half the output rate, wan-2.7-video at the full rate)
  music: flat per track (Music 3.0/2.6 = 200, Lyria 3 = 100, Mureka V9 = 60) except sonilo-music, which
    is 4 credits/s with a 10 s minimum
  sound_effects: per second with a 3 s minimum -- sonilo-sfx 5 credits/s from text, sonilo-video-sfx 15
    credits/s of measured input video
  utility:
    convert-image: 2
    convert-video: 10
    convert-audio: 3
    create-post: 10
  quote_endpoint: POST /v1/cost (operationId estimateCost) returns the exact charge for the exact body,
    computed by the same code that bills
  source: https://docs.budgetpixel.com/concepts/pricing-and-credits
promotions:
  note: 'Time-boxed per-model discounts run on Premium/Pro/Ultra and apply automatically at generation;
    POST /v1/cost quotes the discounted price. Observed live 2026-08-28: Wan 3.0 video 30% off, ending
    Aug 31.'
