deviations:
- field: protocolVersion
  observed: '0.3'
  issue: The card declares A2A 0.3, not 1.0.0. It is graded against 1.0.0 because that is the current
    spec, and it passes; but a strict 1.0.0 client reading the declared version may negotiate down.
- field: url
  observed: https://docs.budgetpixel.com/
  issue: The card advertises the documentation site root as the agent endpoint. That URL serves HTML,
    not an A2A JSON-RPC transport, so an A2A client following it reaches a docs page rather than an agent.
    supportedInterfaces repeats the same docs URL.
- field: provider.organization
  observed: BudgetPixel API
  issue: Names the API rather than the legal organization (BudgetPixel / BudgetPixel AI).
- field: skills[0].tags
  observed: []
  issue: Empty tag array -- the skill cannot be matched by capability keyword.
- field: capabilities
  observed:
    streaming: false
    pushNotifications: false
  issue: Both agent-interaction capabilities are declared false, so the card asserts a non-streaming,
    non-push agent even though the product MCP server does run streamable HTTP.
